  // ── PARSERS ───────────────────────────────
  function categorize(nome){
    var n=nome.toUpperCase();
    if(n.includes('PICOLÉ FRUTA')||n.includes('PICOLE FRUTA')) return 'Picolé Fruta';
    if(n.includes('PICOLÉ MAIS')||n.includes('MAIS CÔCO')||n.includes('COCO QUEIMADO')) return 'Picolé Zero';
    if(n.includes('PICOLÉ CREME')||n.includes('PICOLE CREME')) return 'Picolé Creme';
    if(n.includes('ITUZINHO')||n.includes('KIDS')||n.includes('PICOLÁPIS')) return 'Picolé Infantil';
    if(n.includes('BOMBOM')||n.includes('DIAMOND')||n.includes('BARRITA')||n.includes('CHOCOTINE')) return 'Picolé Premium';
    if(n.includes('MEX.')||n.includes('MEXICANO')) return 'Picolé Premium';
    if(n.includes('GREGO')||n.includes('SPECIALE')||n.includes('SOBREMESA')||n.includes('UNICÓRNIO')) return 'Picolé Premium';
    if(n.includes('PICOLÉ')||n.includes('PICOLE')) return 'Picolé';
    if((n.includes('POTE')||n.includes('SORVETE'))&&n.replace(/\s/g,'').includes('2L')) return 'Pote 2L';
    if(n.includes('NEVADO')||n.includes('1,5')) return 'Pote 1,5L';
    if(n.includes('POTE')) return 'Pote';
    if(n.includes('AÇAÍ')||n.includes('ACAI')) return 'Açaí';
    if(n.includes('CONE')||n.includes('SELETTO')||n.includes('BEST CUP')) return 'Cone / Best Cup';
    if(n.includes('NAPOLICUP')) return 'Especial';
    if(n.includes('SUNDAE')||n.includes('COPINHO')) return 'Sorvete Servido';
    if(n.startsWith('REV -')||n.startsWith('REV –')) return 'Produto Seco';
    return 'Outros';
  }

  function parseEstoque(wb, loja){
    var sheetName = wb.SheetNames.find(function(n){return n.toUpperCase().includes('ESTOQUE');})||wb.SheetNames[0];
    var raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:null});
    var headerIdx=-1;
    for(var i=0;i<Math.min(raw.length,6);i++){
      var rv=(raw[i]||[]).map(function(v){return String(v||'').toUpperCase();});
      if(rv.some(function(v){return v==='CÓD'||v==='COD'||v==='CÓDIGO';})){ headerIdx=i; break; }
    }
    if(headerIdx<0){ _errors.push('Cabeçalho CÓD não encontrado'); return []; }
    var header=(raw[headerIdx]||[]).map(function(v){return String(v||'');});
    var saldoCol=-1, valorCol=-1;
    header.forEach(function(hh,i){
      var hu=hh.toUpperCase();
      if(hu.includes('SALDO-DIA')||hu.includes('SALDO DIA')) saldoCol=i;
      if(hu.includes('VALOR UN')||hu.includes('VALOR UNIT')) valorCol=i;
    });
    if(saldoCol<0) _warnings.push('Coluna Saldo-dia não encontrada pelo nome');
    if(valorCol<0) _warnings.push('Coluna Valor un. não encontrada');
    var rows=[];
    for(var j=headerIdx+1;j<raw.length;j++){
      var row=raw[j]||[];
      var cod=row[0]; if(!cod) continue;
      var codInt=parseInt(String(cod)); if(isNaN(codInt)) continue;
      var nome=String(row[1]||'').trim();
      var saldo=saldoCol>=0?(parseInt(row[saldoCol])||0):0;
      var valor=valorCol>=0?(parseFloat(row[valorCol])||0):0;
      rows.push({sku:String(codInt),produto:nome,estoque:Math.max(0,saldo),valor_unit:valor,valor_total:Math.round(Math.max(0,saldo)*valor*100)/100,loja:loja,categoria:categorize(nome),em_promo:false,preco_t06:null});
    }
    if(rows.length<5) _warnings.push('Apenas '+rows.length+' produtos encontrados');
    return rows;
  }

  function parseVendas(wb, loja){
    var raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
    if((raw[0]||[]).length<2){ _errors.push('Arquivo exportado incorretamente pelo Zanthus (1 coluna). Gere o relatório novamente.'); return []; }
    var rows=[];
    for(var i=5;i<raw.length;i++){
      var row=raw[i]||[];
      var raw0=String(row[0]||'').trim();
      var m=raw0.match(/^0*(\d+)\s*[-\u2013]\s*(.+)$/);
      if(!m) continue;
      var sku=m[1].replace(/^0+/,'')||'0';
      var nome=m[2].trim();
      var qtd=parseInt(row[1])||0;
      var vlr=parseFloat(row[2])||0;
      rows.push({sku:sku,nome:nome,qtd:qtd,vlr:Math.round(vlr*100)/100,loja:loja});
    }
    if(rows.length<3) _errors.push('Nenhum dado encontrado. Arquivo pode estar vazio.');
    return rows;
  }

  // ── APLICAR ───────────────────────────────
  function aplicar(rows){
    var TOTAL_DIAS=87;
    if(_tipo==='estoque'){
      var outros=DADOS.filter(function(p){return p.loja!==_loja;});
      var vmdMap={};
      DADOS.filter(function(p){return p.loja===_loja;}).forEach(function(p){
        vmdMap[p.sku]={vmd:p.vmd,qtd:p.qtd_vendida_periodo,vlr:p.faturamento_vendas};
      });
      var novos=rows.map(function(p){
        var v=vmdMap[p.sku]||{vmd:0,qtd:0,vlr:0};
        var dias=v.vmd>0?Math.round(p.estoque/v.vmd*10)/10:(p.estoque<=0?0:9999);
        var status=p.estoque<=0?'zerado':v.vmd<=0?'sem-giro':dias<3?'ruptura':dias<7?'critico':dias<=15?'atencao':'ok';
        return Object.assign({},p,{estoque_sexta:p.estoque,qtd_vendida_periodo:v.qtd,faturamento_vendas:v.vlr,vmd:v.vmd,dias_estoque:dias>=9999?'∞':dias,dias_num:dias,status:status});
      });
      DADOS.length=0;
      outros.concat(novos).forEach(function(d){DADOS.push(d);});
    } else {
      var periodoKey=_periodo.toLowerCase();
      var outros2=VENDAS_SUM.filter(function(v){return v.loja!==_loja;});
      // SUBSTITUIR: remove existing entries for this loja+period, then add new ones
      var existing=VENDAS_SUM.filter(function(v){return v.loja===_loja;});
      // Zero out the period being replaced for all existing entries
      existing.forEach(function(v){ v[periodoKey]=0; });
      // Now add the new rows (replacing, not accumulating)
      rows.forEach(function(r){
        var idx=existing.findIndex(function(v){return v.sku===r.sku;});
        if(idx>=0){
          // Replace period data, recalc total
          existing[idx][periodoKey]=r.qtd;
          // Recalc total qty and vlr from all periods
          existing[idx].qtd=(existing[idx].abril||0)+(existing[idx].maio||0)+(existing[idx].junho||0)+(existing[idx].sabado||0)+(periodoKey==='hoje'?r.qtd:0);
          if(periodoKey==='abril'||periodoKey==='maio'||periodoKey==='junho'||periodoKey==='sabado'){
            existing[idx].qtd=(existing[idx].abril||0)+(existing[idx].maio||0)+(existing[idx].junho||0)+(existing[idx].sabado||0);
          }
          existing[idx].vlr=r.vlr; // approximate — we only have total vlr per upload
        } else {
          var e={sku:r.sku,nome:r.nome,loja:_loja,qtd:r.qtd,vlr:r.vlr,abril:0,maio:0,junho:0,julho:0,sabado:0};
          e[periodoKey]=r.qtd;
          existing.push(e);
        }
      });
      VENDAS_SUM.length=0;
      outros2.concat(existing).forEach(function(v){VENDAS_SUM.push(v);});
      var vendaMap={};
      VENDAS_SUM.filter(function(v){return v.loja===_loja;}).forEach(function(v){vendaMap[v.sku]={qtd:v.qtd,vlr:v.vlr};});
      // Update CHARTS_DATA monthly for this period
      var periodoLabel=_periodo.charAt(0).toUpperCase()+_periodo.slice(1);
      if(CHARTS_DATA.monthly[_loja]){
        var pVlr=rows.reduce(function(s,r){return s+r.vlr;},0);
        var pQtd=rows.reduce(function(s,r){return s+r.qtd;},0);
        CHARTS_DATA.monthly[_loja][periodoLabel]={vlr:Math.round(pVlr),qtd:pQtd};
        if(CHARTS_DATA.meses.indexOf(periodoLabel)<0) CHARTS_DATA.meses.push(periodoLabel);
      }
      // Dynamic TOTAL_DIAS based on months with data
      var _diasMap={'Abril':30,'Maio':31,'Junho':30,'Julho':31,'Agosto':31,'Setembro':30,'Outubro':31,'Novembro':30,'Dezembro':31};
      var _mesesAtivos=Object.keys(CHARTS_DATA.monthly[_loja]||{}).filter(function(m){return (CHARTS_DATA.monthly[_loja][m]?.vlr||0)>0;});
      var TOTAL_DIAS_DYN=_mesesAtivos.reduce(function(s,m){return s+(_diasMap[m]||30);},0)||87;

      DADOS.filter(function(p){return p.loja===_loja;}).forEach(function(p){
        var v=vendaMap[p.sku]||{qtd:0,vlr:0};
        p.qtd_vendida_periodo=v.qtd; p.faturamento_vendas=v.vlr;
        p.vmd=Math.round(v.qtd/TOTAL_DIAS_DYN*100)/100;
        if(p.estoque<=0){p.status='zerado';p.dias_estoque=0;p.dias_num=0;}
        else if(p.vmd<=0){p.status='sem-giro';p.dias_estoque='∞';p.dias_num=9999;}
        else{var d=Math.round(p.estoque/p.vmd*10)/10;p.dias_estoque=d;p.dias_num=d;p.status=d<3?'ruptura':d<7?'critico':d<=15?'atencao':'ok';}
      });
    }
    document.getElementById('last-update').textContent=_loja+' · '+(_tipo==='estoque'?'estoque':'vendas '+_periodo)+' atualizado';
  }

  // ── ACTIONS ───────────────────────────────
  function _setTipo(t){ _tipo=t; render(); }
  function _setLoja(l){ _loja=l; render(); }
  function _setPeriodo(p){ _periodo=p; render(); }
  function _next(){
    if(_step==='tipo'&&_tipo) _step='loja';
    else if(_step==='loja'&&_loja) _step='periodo';
    render();
  }
  function _back(){
    if(_step==='loja') _step='tipo';
    else if(_step==='periodo') _step='loja';
    else if(_step==='preview') _step='periodo';
    render();
  }
  function _handleFile(file){ if(!file) return; _file=file; render(); }

  function _processar(){
    if(!_file||!_periodo) return;
    document.getElementById('step-content').innerHTML='<div style="text-align:center;padding:48px;color:#6B7280"><div style="font-size:32px;margin-bottom:12px">⏳</div>Processando arquivo…</div>';
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:'array'});
        _errors=[]; _warnings=[];
        _parsed=_tipo==='estoque'?parseEstoque(wb,_loja):parseVendas(wb,_loja);
        if(_errors.length){
          document.getElementById('step-content').innerHTML='<div style="max-width:480px;margin:0 auto;text-align:center;padding:32px"><div style="font-size:36px">❌</div><div style="font-size:15px;font-weight:600;margin-top:12px">Erro ao processar</div><div style="font-size:13px;color:#DC2626;margin-top:8px">'+_errors.join('<br>')+'</div><button onclick="VIEW_IMPORTAR._back()" class="btn-secondary" style="margin-top:16px">← Tentar novamente</button></div>';
          return;
        }
        _step='preview'; render();
      }catch(err){
        document.getElementById('step-content').innerHTML='<div style="text-align:center;padding:32px"><div style="font-size:36px">❌</div><div style="font-size:13px;color:#DC2626;margin-top:8px">'+err.message+'</div><button onclick="VIEW_IMPORTAR._back()" class="btn-secondary" style="margin-top:16px">← Voltar</button></div>';
      }
    };
    reader.readAsArrayBuffer(_file);
  }

  function _aplicar(){
    aplicar(_parsed);
    // Recompute CHARTS_DATA from current VENDAS_SUM
    recomputeChartsData();
    _step='done';
    render();
  }
  function _reset(){ _step='tipo';_tipo=null;_loja=null;_periodo=null;_file=null;_parsed=null;_errors=[];_warnings=[]; }


  function recomputeChartsData(){
    // Rebuild monthly from VENDAS_SUM
    var meses = CHARTS_DATA.meses || ['Abril','Maio','Junho'];
    var diasMap = {'Abril':30,'Maio':31,'Junho':30,'Julho':31,'Agosto':31,'Setembro':30,'Outubro':31,'Novembro':30,'Dezembro':31};
    var lojas = ['Iririú','Floresta','Araquari'];

    // Rebuild monthly vlr/qtd per loja per month
    lojas.forEach(function(loja){
      if(!CHARTS_DATA.monthly[loja]) CHARTS_DATA.monthly[loja]={};
      meses.forEach(function(mes){
        var mesKey = mes.toLowerCase();
        var vlr=0, qtd=0;
        VENDAS_SUM.filter(function(v){return v.loja===loja;}).forEach(function(v){
          qtd += (v[mesKey]||0);
          // Estimate vlr proportionally from total vlr
          if(v.qtd>0) vlr += v.vlr * ((v[mesKey]||0)/v.qtd);
        });
        CHARTS_DATA.monthly[loja][mes]={vlr:Math.round(vlr),qtd:qtd};
      });
    });

    // Rebuild top10
    var skuRev = {};
    VENDAS_SUM.forEach(function(v){
      var k=v.sku;
      if(!skuRev[k]) skuRev[k]={nome:v.nome,vlr:0,qtd:0};
      skuRev[k].vlr+=v.vlr;
      skuRev[k].qtd+=v.qtd;
    });
    var sorted=Object.values(skuRev).sort(function(a,b){return b.vlr-a.vlr;});
    CHARTS_DATA.top10_fat=sorted.slice(0,10).map(function(p){return{nome:p.nome.replace('REV - ','').substring(0,35),vlr:Math.round(p.vlr)};});
    CHARTS_DATA.top10_qtd=sorted.sort(function(a,b){return b.qtd-a.qtd;}).slice(0,10).map(function(p){return{nome:p.nome.replace('REV - ','').substring(0,35),qtd:p.qtd};});

    // Rebuild promo_vs_normal
    var promoSkus=new Set(DADOS.filter(function(d){return d.em_promo;}).map(function(d){return d.sku;}));
    var vlrPromo=0,vlrNormal=0,qtdPromo=0,qtdNormal=0;
    VENDAS_SUM.forEach(function(v){
      if(promoSkus.has(v.sku)){vlrPromo+=v.vlr;qtdPromo+=v.qtd;}
      else{vlrNormal+=v.vlr;qtdNormal+=v.qtd;}
    });
    CHARTS_DATA.promo_vs_normal={vlr_promo:Math.round(vlrPromo),vlr_normal:Math.round(vlrNormal),qtd_promo:qtdPromo,qtd_normal:qtdNormal};

    // Rebuild projecao
    var diasTotais=meses.reduce(function(s,m){return s+(diasMap[m]||30);},0)||87;
    lojas.forEach(function(loja){
      var totalVlr=Object.values(CHARTS_DATA.monthly[loja]||{}).reduce(function(s,m){return s+(m.vlr||0);},0);
      var diario=totalVlr/diasTotais;
      if(!CHARTS_DATA.projecao) CHARTS_DATA.projecao={};
      CHARTS_DATA.projecao[loja]={diario_medio:Math.round(diario*100)/100,projecao_julho:Math.round(diario*31),fat_periodo:totalVlr};
    });

    console.log('CHARTS_DATA recomputed', CHARTS_DATA.monthly);
  }

  return { render, _setTipo, _setLoja, _setPeriodo, _next, _back, _handleFile, _processar, _aplicar, _reset };
})();



// ── PEDIDOS ───────────────────────────────────
const VIEW_PEDIDOS = (function(){

  const LOJA_EMOJI  = {'Iririú':'🏪','Floresta':'🌳','Araquari':'🌿'};

  function fmt(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0}); }
  function fmtN(v){ return (v||0).toLocaleString('pt-BR'); }
  function lojaB(l){

    return '<span class="loja-badge '+(m[l]||'')+'">'+l+'</span>';
  }
  function parseDt(s){
    // dd/mm/yyyy
    var p=s.split('/'); return new Date(p[2],p[1]-1,p[0]);
  }
  function fmtDt(s){
    var p=s.split('/'); return p[0]+'/'+p[1]+'/'+p[2].substring(2);
  }

  function getPedidos(){
    if(_lojaF==='all') return PEDIDOS_DATA;

  }

  // ── TAB: HISTÓRICO ────────────────────────────
  function renderHistorico(){
    var peds = getPedidos().slice().sort(function(a,b){
      return parseDt(b.data)-parseDt(a.data);
    });

    var totalEng = peds.reduce(function(s,p){return s+p.total_engradados;},0);
    var totalUn  = peds.reduce(function(s,p){return s+p.total_unidades;},0);
    var avgEng   = peds.length ? Math.round(totalEng/peds.length) : 0;

    return '<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">'+

  // ── TAB: ANÁLISE DE GIRO ─────────────────────
  function renderGiro(){
    // Per-product analysis: how much was ordered vs how much was sold
    var prodMap = {};
    var peds = getPedidos();

    peds.forEach(function(p){
      p.itens.forEach(function(item){
        var key = item.descricao.substring(0,45).trim();
        if(!prodMap[key]) prodMap[key] = {desc:key, loja:p.loja, pedido_un:0, vendido_un:0, pedidos:0};
        prodMap[key].pedido_un += item.unidades;
        prodMap[key].pedidos   += 1;
      });
    });

    // Match with sales data
    Object.keys(prodMap).forEach(function(key){
      var desc = key.toUpperCase();
      // Try to find matching VENDAS_SUM entry
      var matches = VENDAS_SUM.filter(function(v){
        var nome = v.nome.toUpperCase();
        // Fuzzy match: check if significant words match
        var words = desc.split(' ').filter(function(w){return w.length>4;});
        var matchCount = words.filter(function(w){return nome.includes(w);}).length;
        return matchCount >= Math.min(2, words.length) && (_lojaF==='all' || v.loja===_lojaF);
      });
      prodMap[key].vendido_un = matches.reduce(function(s,v){return s+v.qtd;},0);
    });

    var rows = Object.values(prodMap)
      .filter(function(p){return p.pedido_un > 0;})
      .sort(function(a,b){return b.pedido_un - a.pedido_un;});

    var tableRows = rows.map(function(r){
      var ratio = r.vendido_un > 0 ? Math.round(r.vendido_un / r.pedido_un * 100) : 0;
      var ratioColor = ratio >= 80 ? '#16A34A' : ratio >= 50 ? '#D97706' : '#DC2626';
      var ratioLabel = ratio >= 80 ? 'Bom giro' : ratio >= 50 ? 'Giro médio' : 'Baixo giro';
      var barW = Math.min(ratio, 100);
      return '<tr>'+
        '<td style="font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis">'+r.desc+'</td>'+
        '<td class="col-num">'+fmtN(r.pedido_un)+'</td>'+
        '<td class="col-num">'+fmtN(r.vendido_un)+'</td>'+
        '<td class="col-num">'+
          '<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">'+
            '<div style="width:50px;height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden">'+
              '<div style="width:'+barW+'%;height:100%;background:'+ratioColor+';border-radius:3px"></div>'+
            '</div>'+
            '<span style="color:'+ratioColor+';font-weight:700;min-width:36px">'+ratio+'%</span>'+
          '</div>'+
        '</td>'+
        '<td><span style="font-size:11px;color:'+ratioColor+';font-weight:600">'+ratioLabel+'</span></td>'+
      '</tr>';
    }).join('');

    var totalPedido  = rows.reduce(function(s,r){return s+r.pedido_un;},0);
    var totalVendido = rows.reduce(function(s,r){return s+r.vendido_un;},0);
    var giroGeral    = totalPedido > 0 ? Math.round(totalVendido/totalPedido*100) : 0;

    return '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">'+
      '<div class="kpi-card"><div class="kpi-accent" style="background:#2563EB"></div>'+
        '<div class="kpi-label">Total Pedido (un)</div><div class="kpi-value">'+fmtN(totalPedido)+'</div>'+
        '<div class="kpi-sub">unidades recebidas nos pedidos</div></div>'+
      '<div class="kpi-card"><div class="kpi-accent" style="background:#16A34A"></div>'+
        '<div class="kpi-label">Total Vendido (un)</div><div class="kpi-value">'+fmtN(totalVendido)+'</div>'+
        '<div class="kpi-sub">unidades vendidas no período</div></div>'+
      '<div class="kpi-card"><div class="kpi-accent" style="background:'+(giroGeral>=70?'#16A34A':'#D97706')+'"></div>'+
        '<div class="kpi-label">Giro Geral</div>'+
        '<div class="kpi-value" style="color:'+(giroGeral>=70?'#16A34A':'#D97706')+'">'+giroGeral+'%</div>'+
        '<div class="kpi-sub">do que foi pedido foi vendido</div></div>'+
    '</div>'+
    '<div style="background:#EFF6FF;border:1px solid #DBEAFE;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:12px;color:#1D4ED8">'+
      '<strong>Como ler:</strong> Compara unidades pedidas (engradados × un/cx) com unidades vendidas no período. '+
      'Giro acima de 80% = pediu certo. Entre 50–80% = sobrou estoque. Abaixo de 50% = pediu muito ou produto de baixo giro.'+
    '</div>'+
    '<div class="table-card">'+
      '<div class="table-card-header"><span class="table-card-title">Giro por Produto — '+rows.length+' itens</span></div>'+
      '<div class="table-wrap"><table><thead><tr>'+
        '<th>Produto</th>'+
        '<th style="text-align:right">Un Pedidas</th>'+
        '<th style="text-align:right">Un Vendidas</th>'+
        '<th style="text-align:right">Giro</th>'+
        '<th>Avaliação</th>'+
      '</tr></thead><tbody>'+tableRows+'</tbody></table></div>'+
    '</div>';
  }

  // ── TAB: PRÓXIMO PEDIDO ──────────────────────
  function renderProximoPedido(){
    var lojaF = STORE.getFilters().loja;
    var lojas = lojaF==='all' ? ALL_LOJAS : [lojaF];

    var content = lojas.map(function(l){
      var dados_l = DADOS.filter(function(p){return p.loja===l;});
      // Products that need ordering: status ruptura/critico/atencao OR zerado with sales history
      var precisam = dados_l
        .filter(function(p){
          return p.status==='ruptura'||p.status==='critico'||p.status==='atencao'||
                 (p.status==='zerado'&&p.vmd>0);
        })
        .sort(function(a,b){
          var order = {'ruptura':0,'critico':1,'zerado':2,'atencao':3};
          return (order[a.status]||4)-(order[b.status]||4)||a.dias_num-b.dias_num;
        });

      if(!precisam.length) return '<div style="margin-bottom:20px">'+
        '<div style="font-size:13px;font-weight:700;color:'+LOJA_COLOR[l]+';margin-bottom:10px">'+LOJA_EMOJI[l]+' '+l+'</div>'+
        '<div style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:12px 16px;font-size:13px;color:#15803D">✅ Nenhum produto crítico identificado</div>'+
      '</div>';

      var rows = precisam.map(function(p){
        // Suggest order quantity: VMD × 30 days - current stock
        var sugestao_un = Math.max(0, Math.round(p.vmd * 30 - p.estoque));
        // Convert to engradados — need un_por_cx lookup
        var unCx = 16; // default
        var n = p.produto.toUpperCase();
        if(n.includes('NAPOLICUP')) unCx=60;
        else if(n.includes('PICOLÉ FRUTA')||n.includes('PICOLE FRUTA')) unCx=270;
        else if(n.includes('PICOLÉ CREME')||n.includes('PICOLE CREME')) unCx=270;
        else if(n.includes('PICOLÉ MAIS')||n.includes('PICOLE MAIS')) unCx=270;
        else if(n.includes('BOMBOM')) unCx=198;
        else if(n.includes('DIAMOND')) unCx=156;
        else if(n.includes('ITUZINHO')) unCx=180;
        else if(n.includes('KIDS')) unCx=120;
        else if(n.includes('SOBREMESA')) unCx=228;
        else if(n.includes('CHOCOTINE')||n.includes('BARRITA')) unCx=228;
        else if(n.includes('GREGO')||n.includes('SPECIALE')||n.includes('MEX')) unCx=180;
        else if(n.includes('PICOLÉ')||n.includes('PICOLE')) unCx=270;
        else if(n.includes('DIET 1')||n.includes('ACAI 1L')) unCx=32;
        else if(n.includes('NEVADO')||n.includes('1,5L')) unCx=16;
        else if(n.includes('POTE')) unCx=16;

        var sugestao_cx = Math.ceil(sugestao_un/unCx);
        if(sugestao_cx === 0) sugestao_cx = 1;

        var statusLabel = p.status==='ruptura'?'🔴':p.status==='critico'?'🟠':p.status==='atencao'?'🟡':'⬜';
        return '<tr>'+
          '<td>'+statusLabel+'</td>'+
          '<td style="font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis">'+p.produto+'</td>'+
          '<td class="col-num">'+p.estoque+'</td>'+
          '<td class="col-num">'+(p.vmd>0?p.vmd.toFixed(1):'—')+'</td>'+
          '<td class="col-num" style="color:'+(p.dias_num<7?'#DC2626':'#D97706')+';font-weight:700">'+
            (p.dias_estoque||'—')+'</td>'+
          '<td class="col-num" style="font-weight:700;color:#2563EB">'+sugestao_cx+' cx</td>'+
          '<td class="col-num" style="color:#6B7280">'+fmtN(sugestao_un)+' un</td>'+
        '</tr>';
      }).join('');

      return '<div style="margin-bottom:24px">'+
        '<div style="font-size:14px;font-weight:700;color:'+LOJA_COLOR[l]+';margin-bottom:12px">'+LOJA_EMOJI[l]+' '+l+' — '+precisam.length+' produtos sugeridos</div>'+
        '<div class="table-card">'+
          '<div class="table-wrap"><table><thead><tr>'+
            '<th>!</th><th>Produto</th>'+
            '<th style="text-align:right">Estoque</th>'+
            '<th style="text-align:right">VMD/dia</th>'+
            '<th style="text-align:right">Dias</th>'+
            '<th style="text-align:right">Sugestão cx</th>'+
            '<th style="text-align:right">Em unidades</th>'+
          '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '</div>'+
      '</div>';
    }).join('');

    return '<div style="background:#FFFBEB;border:1px solid #FEF3C7;border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:#B45309">'+
      '<strong>Sugestão baseada em:</strong> VMD × 30 dias − estoque atual = unidades necessárias. Convertido em caixas pelo padrão de cada linha de produto. Ajuste conforme ciclo real de entrega da fábrica.'+
    '</div>'+content;
  }

  // ── RENDER PRINCIPAL ─────────────────────────
  function render(){
    var lojaFilter = STORE.getFilters().loja;
    _lojaF = lojaFilter;

    var content = _tab==='historico' ? renderHistorico() :
                  _tab==='giro'      ? renderGiro()      :
                                       renderProximoPedido();

    document.getElementById('view-container').innerHTML =
      '<div class="tab-bar">'+
        '<button class="tab-btn '+(_tab==='historico'?'active':'')+'" onclick="VIEW_PEDIDOS._setTab(\'historico\')">📋 Histórico de Pedidos</button>'+
        '<button class="tab-btn '+(_tab==='giro'?'active':'')+'" onclick="VIEW_PEDIDOS._setTab(\'giro\')">📊 Análise de Giro</button>'+
        '<button class="tab-btn '+(_tab==='proximo'?'active':'')+'" onclick="VIEW_PEDIDOS._setTab(\'proximo\')">🛒 Sugestão Próximo Pedido</button>'+
      '</div>'+content;
  }

  function _setTab(t){ _tab=t; render(); }
  return { render, _setTab };
})();

  }

  function setView(v){
    cur=v;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
    document.getElementById('page-title').textContent=VIEWS[v]?.title||v;
    document.getElementById('breadcrumb').textContent=VIEWS[v]?.sub||'';
    if(VIEWS[v])VIEWS[v].render();
  }

  function updateBadge(){
    const cnt=DADOS.filter(r=>r.status==='ruptura'||r.status==='critico'||r.status==='zerado').length;
    const b=document.getElementById('badge-alertas');
    if(b){b.textContent=cnt;b.classList.toggle('show',cnt>0);}
  }

  document.addEventListener('DOMContentLoaded',function(){
    loadData();
    document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.view)setView(btn.dataset.view);}));
    document.getElementById('filter-loja').addEventListener('change',e=>{STORE.setFilter('loja',e.target.value);if(VIEWS[cur])VIEWS[cur].render();});
    document.getElementById('filter-categoria').addEventListener('change',e=>{STORE.setFilter('categoria',e.target.value);if(VIEWS[cur])VIEWS[cur].render();});
    document.getElementById('filter-periodo').addEventListener('change',e=>{STORE.setFilter('periodo',parseInt(e.target.value));});
    document.getElementById('data-date').textContent=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
    document.getElementById('last-update').textContent='Estoque 01/07 · 3 filiais';
    setView('dashboard');
    updateBadge();
  });
})();

</script>

<script>
// ── MOBILE SIDEBAR ────────────────────────────
function toggleSidebar(){
  var s=document.getElementById('sidebar');
  var o=document.getElementById('sidebar-overlay');
  s.classList.toggle('open');
  o.classList.toggle('open');
}
// Close sidebar on nav click (mobile)
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.nav-item').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(window.innerWidth<=640){
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('open');
      }
    });
  });
  // Also close on overlay click
  var overlay=document.getElementById('sidebar-overlay');
  if(overlay) overlay.addEventListener('click',toggleSidebar);
});
</script>
</body>
