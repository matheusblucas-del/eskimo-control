// ── MOBILE SIDEBAR ────────────────────────────
function toggleSidebar(){
  const s=document.getElementById('sidebar');
  const o=document.getElementById('sidebar-overlay');
  s.classList.toggle('open');
  o.classList.toggle('open');
}
// Close sidebar when nav item clicked on mobile
document.addEventListener('DOMContentLoaded',function(){
    // Try to load from localStorage first
    var fromLS = loadFromLocalStorage();
    if(fromLS){
      // Data loaded from LS — still need to setup UI
    }
  document.querySelectorAll('.nav-item').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(window.innerWidth<=640){
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('open');
      }
    });
  });
});


// ══════════════════════════════════════════════
//  LOCALSTORAGE PERSISTENCE
// ══════════════════════════════════════════════
const LS_KEY_DADOS   = 'eskimo_dados_v1';
const LS_KEY_VS      = 'eskimo_vs_v1';
const LS_KEY_UPDATED = 'eskimo_updated_v1';

function saveToLocalStorage(){
  try{
    localStorage.setItem(LS_KEY_DADOS,   JSON.stringify(DADOS));
    localStorage.setItem(LS_KEY_VS,      JSON.stringify(VENDAS_SUM));
    localStorage.setItem(LS_KEY_UPDATED, new Date().toISOString());
    console.log('✅ Dados salvos no localStorage');
  }catch(e){ console.warn('localStorage cheio ou indisponível',e); }
}

function loadFromLocalStorage(){
  try{
    const d  = localStorage.getItem(LS_KEY_DADOS);
    const vs = localStorage.getItem(LS_KEY_VS);
    const ts = localStorage.getItem(LS_KEY_UPDATED);
    if(!d) return false;
    const dados_ls = JSON.parse(d);
    const vs_ls    = JSON.parse(vs||'[]');
    // Only load if localStorage has same or more records (not stale/empty)
    if(dados_ls.length < 10) return false;
    DADOS.length = 0;
    dados_ls.forEach(function(p){ DADOS.push(p); });
    VENDAS_SUM.length = 0;
    vs_ls.forEach(function(v){ VENDAS_SUM.push(v); });
    console.log('✅ Dados carregados do localStorage (' + dados_ls.length + ' registros)');
    // Show when data was last updated
    if(ts){
      var dt = new Date(ts);
      var label = 'Salvo em ' + dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      document.getElementById('last-update').textContent = label;
    }
    return true;
  }catch(e){
    console.warn('Erro ao carregar localStorage',e);
    return false;
  }
}

function clearLocalStorage(){
  if(!confirm('Isso vai apagar os dados importados e voltar aos dados originais embutidos no painel. Confirma?')) return;
  localStorage.removeItem(LS_KEY_DADOS);
  localStorage.removeItem(LS_KEY_VS);
  localStorage.removeItem(LS_KEY_UPDATED);
  location.reload();
}

// Auto-save whenever import is applied
var _origAplicar = VIEW_IMPORTAR._aplicar.bind(VIEW_IMPORTAR);
VIEW_IMPORTAR._aplicar = function(){
  _origAplicar();
  saveToLocalStorage();
};

</script>

  <style>
/* =============================================
   ESKIMÓ CONTROL CENTER — DESIGN SYSTEM v4
   Responsive: mobile-first
   ============================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-2:#F0F2F5;
  --border:#E4E7EC;--border-light:#EEF0F3;
  --text-1:#111827;--text-2:#374151;--text-3:#6B7280;--text-4:#9CA3AF;
  --blue:#2563EB;--blue-light:#EFF6FF;--blue-mid:#DBEAFE;--blue-text:#1D4ED8;
  --green:#16A34A;--green-light:#F0FDF4;--green-mid:#DCFCE7;--green-text:#15803D;
  --amber:#D97706;--amber-light:#FFFBEB;--amber-mid:#FEF3C7;--amber-text:#B45309;
  --orange:#EA580C;--orange-light:#FFF7ED;--orange-mid:#FFEDD5;--orange-text:#C2410C;
  --red:#DC2626;--red-light:#FFF1F2;--red-mid:#FFE4E6;--red-text:#B91C1C;
  --gray:#6B7280;--gray-light:#F9FAFB;--gray-mid:#F3F4F6;--gray-text:#374151;
  --sidebar-w:220px;--topbar-h:60px;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}

body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text-1);font-size:14px;line-height:1.5;height:100vh;overflow:hidden;}

/* ── LAYOUT ─────────────────────────────────── */
#app{display:flex;height:100vh;}

/* ── SIDEBAR ─────────────────────────────────── */
.sidebar{width:var(--sidebar-w);height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:200;transition:transform .25s ease;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px;border-bottom:1px solid var(--border-light);}
.brand-icon{font-size:22px;line-height:1;}
.brand-text{font-size:15px;font-weight:700;color:var(--text-1);display:flex;flex-direction:column;line-height:1.2;}
.brand-sub{font-size:10px;font-weight:500;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;}
.sidebar-nav{padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:none;border:none;border-radius:var(--radius-sm);color:var(--text-3);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:all .15s;position:relative;}
.nav-item:hover{background:var(--gray-mid);color:var(--text-1);}
.nav-item.active{background:var(--blue-light);color:var(--blue);}
.nav-icon{width:18px;height:18px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;min-width:18px;text-align:center;display:none;}
.nav-badge.show{display:block;}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--border-light);display:flex;flex-direction:column;gap:6px;}
.last-update{font-size:11px;color:var(--text-4);text-align:center;}

/* Mobile hamburger */
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;box-shadow:var(--shadow-md);}
.hamburger span{display:block;width:20px;height:2px;background:var(--text-2);margin:4px 0;transition:.2s;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;}

/* ── MAIN ─────────────────────────────────────── */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ── TOPBAR ──────────────────────────────────── */
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;gap:12px;}
.topbar-left{flex-shrink:0;min-width:0;}
.page-title{font-size:15px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.breadcrumb{font-size:11px;color:var(--text-4);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.filter-group{display:flex;gap:6px;flex-wrap:wrap;}
.filter-select{padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-2);font-size:12px;font-family:inherit;cursor:pointer;outline:none;transition:border-color .15s;max-width:140px;}
.filter-select:hover,.filter-select:focus{border-color:var(--blue);}
.data-date{font-size:11px;color:var(--text-4);white-space:nowrap;}

/* ── VIEW CONTAINER ──────────────────────────── */
.view-container{flex:1;overflow-y:auto;padding:20px;scroll-behavior:smooth;}

/* ── KPI CARDS ───────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden;cursor:default;transition:box-shadow .15s;}
.kpi-card:hover{box-shadow:var(--shadow-md);}
.kpi-accent{position:absolute;left:0;top:0;bottom:0;width:3px;}
.kpi-label{font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;padding-left:10px;}
.kpi-value{font-size:20px;font-weight:700;color:var(--text-1);line-height:1;padding-left:10px;}
.kpi-sub{font-size:11px;color:var(--text-4);margin-top:3px;padding-left:10px;}
.kpi-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.12;}

/* ── CHARTS ──────────────────────────────────── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.charts-grid-3{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:16px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.chart-card.full-width{grid-column:1/-1;}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.chart-title{font-size:13px;font-weight:600;color:var(--text-1);}
.chart-legend{display:flex;gap:12px;font-size:11px;color:var(--text-3);flex-wrap:wrap;}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;}
.chart-wrap{position:relative;}

/* ── TABLES ──────────────────────────────────── */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;}
.table-card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border-light);flex-wrap:wrap;gap:8px;}
.table-card-title{font-size:13px;font-weight:600;color:var(--text-1);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;}
thead th{padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;background:var(--gray-light);border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border-light);transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--gray-light);}
tbody td{padding:9px 12px;font-size:13px;color:var(--text-2);white-space:nowrap;}
.col-sku{color:var(--text-4);font-size:12px;font-family:monospace;}
.col-num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;}
.col-money{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--text-1);}

/* ── BADGES ──────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;}
.badge-ok{background:var(--green-mid);color:var(--green-text);}
.badge-ok::before{background:var(--green);}
.badge-atencao{background:var(--amber-mid);color:var(--amber-text);}
.badge-atencao::before{background:var(--amber);}
.badge-critico{background:var(--orange-mid);color:var(--orange-text);}
.badge-critico::before{background:var(--orange);}
.badge-ruptura{background:var(--red-mid);color:var(--red-text);}
.badge-ruptura::before{background:var(--red);}
.badge-zerado{background:var(--gray-mid);color:var(--gray-text);}
.badge-zerado::before{background:var(--gray);}
.loja-badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;}
.loja-iririu{background:var(--blue-mid);color:var(--blue-text);}
.loja-floresta{background:#E0F2FE;color:#0369A1;}
.loja-araquari{background:var(--green-mid);color:var(--green-text);}
.promo-badge{background:var(--amber-mid);color:var(--amber-text);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;}
.super-badge{background:var(--red-mid);color:var(--red-text);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;}
.novo-badge{background:var(--green-mid);color:var(--green-text);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;}

/* ── ALERT ITEMS ─────────────────────────────── */
.section-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.alert-grid{display:grid;gap:8px;margin-bottom:18px;}
.alert-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid;border-radius:var(--radius-sm);padding:10px 14px;display:grid;grid-template-columns:1fr auto auto auto auto;align-items:center;gap:12px;}
.alert-item-ruptura{border-left-color:var(--red);}
.alert-item-critico{border-left-color:var(--orange);}
.alert-item-atencao{border-left-color:var(--amber);}
.alert-item-giro{border-left-color:var(--blue);}
.alert-name{font-size:13px;font-weight:600;color:var(--text-1);}
.alert-meta{font-size:11px;color:var(--text-4);margin-top:2px;}
.alert-num{font-size:14px;font-weight:700;color:var(--text-1);text-align:right;}
.alert-unit{font-size:10px;color:var(--text-4);text-align:right;}

/* ── TABS ────────────────────────────────────── */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab-btn{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text-3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;margin-bottom:-1px;white-space:nowrap;}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-btn:hover{color:var(--text-1);}

/* ── FILTER ROW ──────────────────────────────── */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filter-row input,.filter-row select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;font-family:inherit;outline:none;background:var(--surface);color:var(--text-1);}
.filter-row input:focus,.filter-row select:focus{border-color:var(--blue);}
.count-badge{font-size:11px;font-weight:600;padding:2px 8px;background:var(--gray-mid);color:var(--text-3);border-radius:4px;}

/* ── TRANSFER CARDS ──────────────────────────── */
.transfer-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:var(--radius-sm);padding:12px 14px;display:grid;grid-template-columns:1fr 72px 72px 72px 56px 56px;align-items:center;gap:8px;margin-bottom:8px;}
.transfer-card:hover{background:var(--gray-light);}
.stock-bar{height:5px;border-radius:3px;display:inline-block;}

/* ── BUTTONS ─────────────────────────────────── */
.btn-primary{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
.btn-primary:hover{background:#1d4ed8;}
.btn-secondary{padding:8px 16px;background:var(--surface);color:var(--text-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s;}
.btn-secondary:hover{background:var(--gray-light);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:5px;}
.btn-import{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
.btn-import:hover{background:#1d4ed8;}

/* ── MISC ────────────────────────────────────── */
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.compare-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.compare-card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border-light);}
.compare-card-title{font-size:13px;font-weight:700;color:var(--text-1);}
.col-delta-pos{color:#16A34A;font-weight:600;}
.col-delta-neg{color:#DC2626;font-weight:600;}
.col-promo{color:#B45309;font-weight:700;}

/* ── SCROLLBAR ───────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-4);}

/* ── PROMO CARD (vendas view) ────────────────── */
.promo-card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--amber);border-radius:var(--radius);padding:14px;}
.promo-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;}

/* ════════════════════════════════════════════════
   RESPONSIVE — TABLET  (≤900px)
   ════════════════════════════════════════════════ */
@media (max-width:900px){
  .charts-grid{grid-template-columns:1fr;}
  .charts-grid-3{grid-template-columns:1fr;}
  .compare-row{grid-template-columns:1fr;}
  .transfer-card{grid-template-columns:1fr 60px 60px 60px 48px 48px;gap:6px;}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
  .data-date{display:none;}
  .filter-group{gap:4px;}
  .filter-select{font-size:11px;padding:4px 6px;}
}

/* ════════════════════════════════════════════════
   RESPONSIVE — MOBILE  (≤640px)
   ════════════════════════════════════════════════ */
@media (max-width:640px){
  /* Sidebar off-canvas */
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow-md);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.open{display:block;}
  .hamburger{display:block;}

  /* Main pushes right with topbar indent */
  .main-content{width:100vw;}
  .topbar{padding:0 12px 0 52px;height:52px;}
  .page-title{font-size:14px;}
  .breadcrumb{display:none;}
  .topbar-right{gap:4px;}
  .filter-group{gap:3px;}
  .filter-select{max-width:110px;font-size:11px;}

  /* View padding */
  .view-container{padding:12px;}

  /* KPI: 2 cols on mobile */
  .kpi-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .kpi-value{font-size:17px;}
  .kpi-sub{font-size:10px;}
  .kpi-icon{display:none;}

  /* Charts single col */
  .charts-grid,.charts-grid-3{grid-template-columns:1fr;}
  .compare-row{grid-template-columns:1fr;}

  /* Alert items: stack on mobile */
  .alert-item{grid-template-columns:1fr auto auto;gap:8px;}
  .alert-item > div:nth-child(4),.alert-item > div:nth-child(5){display:none;}

  /* Transfer cards: simplified */
  .transfer-card{grid-template-columns:1fr 52px 52px 44px;gap:6px;}
  .transfer-card > div:nth-child(4),.transfer-card > div:nth-child(5),.transfer-card > div:nth-child(6){display:none;}

  /* Tables: allow horizontal scroll */
  .table-wrap{overflow-x:auto;}
  tbody td,thead th{padding:7px 10px;font-size:12px;}

  /* Tab bar scroll */
  .tab-bar{gap:0;}
  .tab-btn{padding:8px 12px;font-size:12px;}

  /* Filter row: wrap */
  .filter-row{gap:6px;}
  .filter-row input{width:100%;max-width:none;}
}
</style>
</head>
<body>
<div id="app">
  <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🍦</span>
      <span class="brand-text">Eskimó<span class="brand-sub">Control Center</span></span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="analise">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Análise SKU
        <span class="nav-badge show" id="badge-analise" style="background:#D97706;display:block">T06</span>

<script>
// modules/store.js
// Estado global reativo — MVP Eskimó Control Center

const STORE = (function() {
  let _data = {
    produtos: [],   // [{sku, codigo, produto, categoria}]
    estoque: [],    // [{data, loja, sku, quantidade}]
    vendas: [],     // [{data, loja, sku, quantidade_vendida, valor_vendido}]
    enriched: [],   // calculado pelo calculator.js
  };

  let _filters = {
    loja: 'all',
    categoria: 'all',
    periodo: 30,
    search: '',
  };

  let _listeners = [];

  // ---- Persistência ----
  function save() {
    try {
      localStorage.setItem('eskimo_data', JSON.stringify(_data));
      localStorage.setItem('eskimo_filters', JSON.stringify(_filters));
    } catch (e) { console.warn('localStorage cheio', e); }
  }

  function load() {
    try {
      const d = localStorage.getItem('eskimo_data');
      const f = localStorage.getItem('eskimo_filters');
      if (d) _data = JSON.parse(d);
      if (f) _filters = Object.assign(_filters, JSON.parse(f));
      return !!d;
    } catch (e) { return false; }
  }

  // ---- Mutation ----
  function setData(key, rows) {
    _data[key] = rows;
    _data.enriched = [];
    save();
    emit();
  }

  function setEnriched(rows) {
    _data.enriched = rows;
    emit();
  }

  function setFilter(key, value) {
    _filters[key] = value;
    emit();
  }

  // ---- Queries ----
  function getData(key) { return _data[key] || []; }

  function getFilters() { return Object.assign({}, _filters); }

  function getPeriodoDatas() {
    const hoje = new Date();
    const inicio = new Date(hoje);
    inicio.setDate(inicio.getDate() - _filters.periodo);
    return { inicio, hoje };
  }

  function getVendasFiltradas() {
    const { inicio } = getPeriodoDatas();
    return _data.vendas.filter(v => {
      const d = new Date(v.data);
      const matchPeriodo = d >= inicio;
      const matchLoja = _filters.loja === 'all' || v.loja === _filters.loja;
      return matchPeriodo && matchLoja;
    });
  }

  function getEstoqueFiltrado() {
    return _data.estoque.filter(e => {
      const matchLoja = _filters.loja === 'all' || e.loja === _filters.loja;
      return matchLoja;
    });
  }

  function getEnrichedFiltrado() {
    return _data.enriched.filter(r => {
      const matchLoja = _filters.loja === 'all' || r.loja === _filters.loja;
      const matchCat = _filters.categoria === 'all' || r.categoria === _filters.categoria;
      const matchSearch = !_filters.search ||
        r.produto.toLowerCase().includes(_filters.search.toLowerCase()) ||
        r.sku.toLowerCase().includes(_filters.search.toLowerCase());
      return matchLoja && matchCat && matchSearch;
    });
  }

  function getCategorias() {
    const cats = [...new Set(_data.produtos.map(p => p.categoria))].filter(Boolean);
    return cats.sort();
  }

  function getProdutoMap() {
    const m = {};
    _data.produtos.forEach(p => { m[p.sku] = p; });
    return m;
  }

  // ---- Pub/Sub ----
  function on(fn) { _listeners.push(fn); }
  function off(fn) { _listeners = _listeners.filter(l => l !== fn); }
  function emit() { _listeners.forEach(fn => fn()); }

  return {
    save, load,
    setData, setEnriched, setFilter,
    getData, getFilters, getPeriodoDatas,
    getVendasFiltradas, getEstoqueFiltrado, getEnrichedFiltrado,
    getCategorias, getProdutoMap,
    on, off,
  };
})();
// modules/importer.js
// Parse de XLSX / XLS / CSV via SheetJS

const IMPORTER = (function() {

  function parseFile(file, tipo) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });
          const rows = normalize(raw, tipo);
          resolve(rows);
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = reject;
      reader.readAsBinaryString(file);
    });
  }

  function normalize(raw, tipo) {
    const keyMap = {
      produtos: {
        sku: ['sku', 'SKU', 'Sku'],
        codigo: ['codigo', 'código', 'Código', 'Codigo', 'code'],
        produto: ['produto', 'Produto', 'nome', 'Nome', 'name', 'descricao'],
        categoria: ['categoria', 'Categoria', 'category'],
      },
      estoque: {
        data: ['data', 'Data', 'date', 'Date'],
        loja: ['loja', 'Loja', 'store', 'filial'],
        sku: ['sku', 'SKU'],
        quantidade: ['quantidade', 'Quantidade', 'qtd', 'Qtd', 'qty'],
      },
      vendas: {
        data: ['data', 'Data', 'date'],
        loja: ['loja', 'Loja', 'store'],
        sku: ['sku', 'SKU'],
        quantidade_vendida: ['quantidade_vendida', 'qtd_vendida', 'Quantidade Vendida', 'qtd vendida', 'vendas', 'qty'],
        valor_vendido: ['valor_vendido', 'valor', 'Valor', 'Valor Vendido', 'faturamento', 'revenue'],
      }
    };

    const fields = keyMap[tipo];

    return raw.map(row => {
      const out = {};
      Object.entries(fields).forEach(([field, aliases]) => {
        const key = Object.keys(row).find(k => aliases.map(a => a.toLowerCase()).includes(k.toLowerCase()));
        out[field] = key !== undefined ? row[key] : '';
      });

      // Normalizar tipos
      if (tipo === 'estoque') {
        out.quantidade = parseFloat(out.quantidade) || 0;
        if (out.data instanceof Date) out.data = out.data.toISOString().split('T')[0];
      }
      if (tipo === 'vendas') {
        out.quantidade_vendida = parseFloat(out.quantidade_vendida) || 0;
        out.valor_vendido = parseFloat(out.valor_vendido) || 0;
        if (out.data instanceof Date) out.data = out.data.toISOString().split('T')[0];
      }
      return out;
    }).filter(r => r.sku);
  }

  return { parseFile };
})();
// modules/calculator.js
// Regras de negócio: VMD, dias de estoque, status de alerta

const CALCULATOR = (function() {

  function calcularStatus(dias, qtd) {
    if (qtd === 0) return 'zerado';
    if (dias < 3) return 'ruptura';
    if (dias < 7) return 'critico';
    if (dias <= 15) return 'atencao';
    return 'ok';
  }

  function enrich(produtos, estoque, vendas, periodo) {
    const prodMap = {};
    produtos.forEach(p => { prodMap[p.sku] = p; });

    // Calcular venda mensal por loja+sku no período
    const vendaMap = {};
    const hoje = new Date();
    const inicio = new Date(hoje);
    inicio.setDate(inicio.getDate() - periodo);

    vendas.forEach(v => {
      const d = new Date(v.data);
      if (d < inicio) return;
      const key = `${v.loja}__${v.sku}`;
      if (!vendaMap[key]) vendaMap[key] = { qtd: 0, vlr: 0 };
      vendaMap[key].qtd += v.quantidade_vendida;
      vendaMap[key].vlr += v.valor_vendido;
    });

    const rows = [];
    estoque.forEach(e => {
      const prod = prodMap[e.sku] || { produto: e.sku, categoria: 'Sem categoria', codigo: '' };
      const key = `${e.loja}__${e.sku}`;
      const venda = vendaMap[key] || { qtd: 0, vlr: 0 };

      const giro = venda.qtd;
      const vmd = parseFloat((giro / periodo).toFixed(2));
      const dias = vmd > 0 ? Math.round(e.quantidade / vmd) : (e.quantidade > 0 ? 9999 : 0);
      const status = calcularStatus(dias, e.quantidade);

      rows.push({
        loja: e.loja,
        sku: e.sku,
        codigo: prod.codigo || '',
        produto: prod.produto || e.sku,
        categoria: prod.categoria || 'Sem categoria',
        estoque: e.quantidade,
        giro_mensal: giro,
        vmd: vmd,
        dias_estoque: dias === 9999 ? '∞' : dias,
        dias_num: dias === 9999 ? 9999 : dias,
        faturamento: parseFloat(venda.vlr.toFixed(2)),
        status,
      });
    });

    return rows;
  }

  function calcularKPIs(enriched, vendas, periodo) {
    const hoje = new Date();
    const inicio = new Date(hoje);
    inicio.setDate(inicio.getDate() - periodo);

    const vendasPeriodo = vendas.filter(v => new Date(v.data) >= inicio);

    const faturamentoTotal = vendasPeriodo.reduce((s, v) => s + v.valor_vendido, 0);
    const faturamentoIririu = vendasPeriodo.filter(v => v.loja === 'Iririú').reduce((s, v) => s + v.valor_vendido, 0);
    const faturamentoFloresta = vendasPeriodo.filter(v => v.loja === 'Floresta').reduce((s, v) => s + v.valor_vendido, 0);

    const skusUnicos = new Set(enriched.map(r => r.sku)).size;
    const criticos = enriched.filter(r => r.status === 'critico' || r.status === 'ruptura').length;
    const atencao = enriched.filter(r => r.status === 'atencao').length;

    return {
      faturamentoTotal: parseFloat(faturamentoTotal.toFixed(2)),
      faturamentoIririu: parseFloat(faturamentoIririu.toFixed(2)),
      faturamentoFloresta: parseFloat(faturamentoFloresta.toFixed(2)),
      skusUnicos,
      criticos,
      atencao,
    };
  }

  function calcularVendasPorDia(vendas, periodo, loja = 'all') {
    const hoje = new Date();
    const inicio = new Date(hoje);
    inicio.setDate(inicio.getDate() - periodo);

    const mapa = {};
    for (let d = periodo - 1; d >= 0; d--) {
      const dt = new Date(hoje);
      dt.setDate(dt.getDate() - d);
      mapa[dt.toISOString().split('T')[0]] = { iririu: 0, floresta: 0 };
    }

    vendas.forEach(v => {
      const d = new Date(v.data);
      if (d < inicio) return;
      const key = v.data;
      if (!mapa[key]) return;
      if (v.loja === 'Iririú') mapa[key].iririu += v.valor_vendido;
      if (v.loja === 'Floresta') mapa[key].floresta += v.valor_vendido;
    });

    const labels = Object.keys(mapa).map(d => {
      const dt = new Date(d + 'T12:00:00');
      return dt.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    });

    return {
      labels,
      iririu: Object.values(mapa).map(v => parseFloat(v.iririu.toFixed(2))),
      floresta: Object.values(mapa).map(v => parseFloat(v.floresta.toFixed(2))),
    };
  }

  function topProdutos(enriched, por = 'faturamento', n = 10) {
    const map = {};
    enriched.forEach(r => {
      if (!map[r.sku]) map[r.sku] = { produto: r.produto, faturamento: 0, giro: 0 };
      map[r.sku].faturamento += r.faturamento;
      map[r.sku].giro += r.giro_mensal;
    });
    return Object.values(map)
      .sort((a, b) => b[por === 'faturamento' ? 'faturamento' : 'giro'] - a[por === 'faturamento' ? 'faturamento' : 'giro'])
      .slice(0, n);
  }

  function estoquePorCategoria(enriched) {
    const map = {};
    enriched.forEach(r => {
      if (!map[r.categoria]) map[r.categoria] = 0;
      map[r.categoria] += r.estoque;
    });
    return { labels: Object.keys(map), valores: Object.values(map) };
  }

  return { enrich, calcularKPIs, calcularVendasPorDia, topProdutos, estoquePorCategoria };
})();

    // If global filter is set to one loja, show only that
    const f = STORE.getFilters().loja;
    if (f !== 'all') return [f];
    return ALL_LOJAS.filter(l => LOJA_CFG[l].on);
  }

  function toggle(loja) {
    const active = activeLojas();
    // Don't allow deselecting last one
    if (active.length === 1 && active[0] === loja) return;
    LOJA_CFG[loja].on = !LOJA_CFG[loja].on;
    render();
  }

  function render() {
    const active = activeLojas();
    const globalFilter = STORE.getFilters().loja;

    // Aggregate rows for active lojas
    const catF=STORE.getFilters().categoria;
    const rows = DADOS.filter(r => active.includes(r.loja)&&(catF==='all'||r.categoria===catF));

    const total_val = rows.reduce((s,r)=>s+r.valor_total, 0);
    const total_un  = rows.reduce((s,r)=>s+r.estoque, 0);

    // Per-loja values (always show all 3 in KPIs)
    const pL = {};
    ALL_LOJAS.forEach(l => {
      const lr = DADOS.filter(r=>r.loja===l);
      pL[l] = {
        est: lr.reduce((s,r)=>s+r.valor_total,0),
        un:  lr.reduce((s,r)=>s+r.estoque,0),
        fat: VENDAS_SUM.filter(v=>v.loja===l).reduce((s,v)=>s+v.vlr,0),
        skus:new Set(lr.map(r=>r.sku)).size,
      };
    });

    const zerados  = rows.filter(r=>r.status==='zerado').length;
    const criticos = rows.filter(r=>r.status==='ruptura'||r.status==='critico').length;
    const atencao  = rows.filter(r=>r.status==='atencao').length;

    // Loja toggle buttons
    const togglesHtml = globalFilter === 'all' ? `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">
        <span style="font-size:12px;color:#9CA3AF;font-weight:500">Lojas no gráfico:</span>
        ${ALL_LOJAS.map(l => `
          <button onclick="VIEW_DASHBOARD._toggle('${l}')"
            style="padding:5px 14px;border-radius:20px;border:2px solid ${LOJA_CFG[l].color};
                   background:${LOJA_CFG[l].on ? LOJA_CFG[l].color : 'transparent'};
                   color:${LOJA_CFG[l].on ? '#fff' : LOJA_CFG[l].color};
                   font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s">
            ${LOJA_CFG[l].emoji} ${l}
          </button>`).join('')}
        <span style="font-size:11px;color:#D1D5DB;margin-left:4px">clique para ocultar/mostrar</span>
      </div>` : `
      <div style="background:#EFF6FF;border:1px solid #DBEAFE;border-radius:8px;padding:8px 14px;margin-bottom:14px;font-size:12px;color:#2563EB">
        Filtro global ativo: <strong>${globalFilter}</strong> — mostrando apenas esta filial
      </div>`;

    const c = document.getElementById('view-container');
    c.innerHTML = `
      ${togglesHtml}

      <!-- KPI row 1: per-loja -->
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
        ${ALL_LOJAS.map(l=>`
          <div class="kpi-card" style="opacity:${active.includes(l)?1:0.4};transition:opacity .2s">
            <div class="kpi-accent" style="background:${LOJA_CFG[l].color}"></div>
            <div class="kpi-label">${LOJA_CFG[l].emoji} ${l}</div>
            <div class="kpi-value" style="font-size:18px">${fmt(pL[l].est)}</div>
            <div class="kpi-sub">Fat. período: ${fmt(pL[l].fat)} · ${fmtN(pL[l].un)} un</div>
          </div>`).join('')}
      </div>

      <!-- KPI row 2: operational -->
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
        <div class="kpi-card">
          <div class="kpi-accent" style="background:#2563EB"></div>
          <div class="kpi-label">Valor Total Est. (ativas)</div>
          <div class="kpi-value">${fmt(total_val)}</div>
          <div class="kpi-sub">${fmtN(total_un)} unidades físicas</div>
          <div class="kpi-icon">📦</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-accent" style="background:#DC2626"></div>
          <div class="kpi-label">Ruptura / Crítico</div>
          <div class="kpi-value" style="color:${criticos>0?'#DC2626':'#16A34A'}">${criticos}</div>
          <div class="kpi-sub">menos de 7 dias de venda</div>
          <div class="kpi-icon">🚨</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-accent" style="background:#D97706"></div>
          <div class="kpi-label">Em Atenção</div>
          <div class="kpi-value" style="color:${atencao>0?'#D97706':'#16A34A'}">${atencao}</div>
          <div class="kpi-sub">7 a 15 dias de venda</div>
          <div class="kpi-icon">⚠️</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-accent" style="background:#6B7280"></div>
          <div class="kpi-label">Zerados</div>
          <div class="kpi-value" style="color:${zerados>0?'#6B7280':'#16A34A'}">${zerados}</div>
          <div class="kpi-sub">sem estoque físico</div>
          <div class="kpi-icon">⬜</div>
        </div>
      </div>

      <!-- Faturamento mensal -->
      <div class="chart-card" style="margin-bottom:16px">
        <div class="chart-header">
          <span class="chart-title">Faturamento por Mês</span>
          <div class="chart-legend">
            ${active.map(l=>`<span><span class="legend-dot" style="background:${LOJA_CFG[l].color}"></span>${l}</span>`).join('')}
          </div>
        </div>
        <div class="chart-wrap" style="height:220px">
          <canvas id="c-mensal" role="img" aria-label="Faturamento mensal por loja">Faturamento mensal.</canvas>
        </div>
      </div>

      <!-- Top 10 + categoria -->
      <div class="charts-grid" style="margin-bottom:16px">
        <div class="chart-card">
          <div class="chart-header"><span class="chart-title">Top 10 por Faturamento (período)</span></div>
          <div class="chart-wrap" id="wrap-fat" style="height:320px">
            <canvas id="c-top-fat" role="img" aria-label="Top 10 por faturamento">Top 10 faturamento.</canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-header"><span class="chart-title">Top 10 por Quantidade Vendida</span></div>
          <div class="chart-wrap" id="wrap-qtd" style="height:320px">
            <canvas id="c-top-qtd" role="img" aria-label="Top 10 por quantidade">Top 10 quantidade.</canvas>
          </div>
        </div>
      </div>

      <!-- Estoque por categoria -->
      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-title">Estoque por Categoria (valor R$)</span>
          <div class="chart-legend">
            ${active.map(l=>`<span><span class="legend-dot" style="background:${LOJA_CFG[l].color}"></span>${l}</span>`).join('')}
          </div>
        </div>
        <div class="chart-wrap" id="wrap-cat" style="height:300px">
          <canvas id="c-cat" role="img" aria-label="Estoque por categoria">Estoque por categoria.</canvas>
        </div>
      </div>
    `;

    // Add estimation banner
    const _b=document.createElement('div');
    _b.style.cssText='background:#FFFBEB;border:1px solid #FEF3C7;border-radius:10px;padding:10px 16px;margin-bottom:14px;font-size:12px;color:#B45309;display:flex;align-items:center;gap:10px';
    _b.innerHTML='<span style="font-size:16px">📅</span><div><strong>Estoque atualizado — 01/07/2026</strong> · Dados reais das três filiais. VMD calculado sobre 87 dias (Abr–Jun + Sáb).</div>';
    _b.style.cssText='background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:10px 16px;margin-bottom:14px;font-size:12px;color:#15803D;display:flex;align-items:center;gap:10px';
    const _vc=document.getElementById('view-container');
    if(_vc) _vc.insertBefore(_b,_vc.firstChild);

    setTimeout(() => drawCharts(active), 60);
  }

  function drawCharts(active) {
    const CD = CHARTS_DATA;
    const FONT = {family:'Inter,sans-serif',size:11};
    const GRID = {color:'#E4E7EC',drawBorder:false};
    const TT   = {backgroundColor:'#1A1A2E',titleColor:'#fff',bodyColor:'#CBD5E1',padding:10,cornerRadius:8,
                  titleFont:{...FONT,weight:'600'},bodyFont:FONT};
    const fmtCur = v => 'R$'+(v>=1000?(v/1000).toFixed(0)+'k':v);

    if (!window._EC) window._EC = {};
    Object.values(window._EC).forEach(c => { try{ c.destroy(); }catch(e){} });
    window._EC = {};

    // ── Monthly bar chart (active lojas only)
    const ctx1 = document.getElementById('c-mensal');
    if (ctx1) window._EC['mensal'] = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: CD.meses,
        datasets: active.map(l => ({
          label: l,
          data: CD.meses.map(m => Math.round(CD.monthly[l]?.[m]?.vlr || 0)),
          backgroundColor: LOJA_CFG[l].color,
          borderRadius: 5,
          barPercentage: 0.75,
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { ...TT, callbacks: { label: c => ' '+c.dataset.label+': R$'+c.parsed.y.toLocaleString('pt-BR') }}
        },
        scales: {
          x: { grid:{display:false}, ticks:{font:FONT,color:'#9CA3AF'} },
          y: { grid:GRID, ticks:{font:FONT,color:'#9CA3AF',callback:fmtCur} }
        }
      }
    });

    // ── Top 10 faturamento (filtered by active lojas)
    const filteredVendas = VENDAS_SUM.filter(v => active.includes(v.loja));
    const skuFat = {};
    filteredVendas.forEach(v => {
      if (!skuFat[v.sku]) skuFat[v.sku] = {nome:v.nome, vlr:0, qtd:0};
      skuFat[v.sku].vlr += v.vlr;
      skuFat[v.sku].qtd += v.qtd;
    });
    const clean = n => n.replace('REV - ','').replace('REV – ','').substring(0,32);
    const top10f = Object.values(skuFat).sort((a,b)=>b.vlr-a.vlr).slice(0,10);
    const top10q = Object.values(skuFat).sort((a,b)=>b.qtd-a.qtd).slice(0,10);

    const hFat = Math.max(280, top10f.length*30+50);
    document.getElementById('wrap-fat').style.height = hFat+'px';
    const ctx2 = document.getElementById('c-top-fat');
    if (ctx2) window._EC['fat'] = new Chart(ctx2, {
      type:'bar', data:{
        labels: top10f.map(p=>clean(p.nome)),
        datasets:[{data:top10f.map(p=>round2(p.vlr)), backgroundColor:'#2563EB', borderRadius:3, barThickness:16}]
      },
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:c=>' R$'+c.parsed.x.toLocaleString('pt-BR',{minimumFractionDigits:0})}}},
        scales:{x:{grid:GRID,ticks:{font:FONT,color:'#9CA3AF',callback:fmtCur}},y:{grid:{display:false},ticks:{font:FONT,color:'#374151'}}}}
    });

    const hQtd = Math.max(280, top10q.length*30+50);
    document.getElementById('wrap-qtd').style.height = hQtd+'px';
    const ctx3 = document.getElementById('c-top-qtd');
    if (ctx3) window._EC['qtd'] = new Chart(ctx3, {
      type:'bar', data:{
        labels: top10q.map(p=>clean(p.nome)),
        datasets:[{data:top10q.map(p=>p.qtd), backgroundColor:'#0891B2', borderRadius:3, barThickness:16}]
      },
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:c=>' '+c.parsed.x.toLocaleString('pt-BR')+' un'}}},
        scales:{x:{grid:GRID,ticks:{font:FONT,color:'#9CA3AF'}},y:{grid:{display:false},ticks:{font:FONT,color:'#374151'}}}}
    });

    // ── Category stock chart (stacked per active loja)
    const filtRows = DADOS.filter(r => active.includes(r.loja));
    const catPerLoja = {};
    active.forEach(l => { catPerLoja[l] = {}; });
    filtRows.forEach(r => {
      if (!catPerLoja[r.loja][r.categoria]) catPerLoja[r.loja][r.categoria] = 0;
      catPerLoja[r.loja][r.categoria] += r.valor_total;
    });
    const allCats = [...new Set(filtRows.map(r=>r.categoria))].sort();
    const hCat = Math.max(260, allCats.length*34+60);
    document.getElementById('wrap-cat').style.height = hCat+'px';
    const ctx4 = document.getElementById('c-cat');
    if (ctx4) window._EC['cat'] = new Chart(ctx4, {
      type:'bar',
      data:{
        labels: allCats.map(c=>c.length>18?c.substring(0,16)+'…':c),
        datasets: active.map(l=>({
          label: l,
          data: allCats.map(c=>Math.round(catPerLoja[l]?.[c]||0)),
          backgroundColor: LOJA_CFG[l].color,
          borderRadius: 3,
          barThickness: active.length===1?20:active.length===2?14:10,
        }))
      },
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:c=>' '+c.dataset.label+': R$'+c.parsed.x.toLocaleString('pt-BR',{minimumFractionDigits:0})}}},
        scales:{x:{grid:GRID,ticks:{font:FONT,color:'#9CA3AF',callback:fmtCur}},y:{grid:{display:false},ticks:{font:FONT,color:'#374151'}}}}
    });
  }

  function round2(v){ return Math.round(v*100)/100; }

  function _toggle(loja) { toggle(loja); }

  return { render, _toggle };
})();


// ── ESTOQUE ───────────────────────────────
const VIEW_ESTOQUE = (function(){
  let _s='', _sortCol='dias_estoque', _sortDir='asc';

  function badge(status){
    const m={ok:'badge-ok',atencao:'badge-atencao',critico:'badge-critico',ruptura:'badge-ruptura',zerado:'badge-zerado','sem-giro':'badge-zerado'};
    const l={ok:'OK',atencao:'Atenção',critico:'Crítico',ruptura:'Ruptura',zerado:'Zerado','sem-giro':'Sem giro'};
    return `<span class="badge ${m[status]||'badge-zerado'}">${l[status]||status}</span>`;
  }
  function lojaB(l){return l==='Iririú'?'<span class="loja-badge loja-iririu">Iririú</span>':l==='Araquari'?'<span class="loja-badge loja-araquari">Araquari</span>':'<span class="loja-badge loja-floresta">Floresta</span>';}
  function diasC(d){if(d>=9999||d==='—')return '#16A34A';if(d<3)return '#DC2626';if(d<7)return '#EA580C';if(d<=15)return '#D97706';return '#16A34A';}
  function th(col,lbl,r){const a=_sortCol===col?(_sortDir==='asc'?' ↑':' ↓'):'';return `<th style="cursor:pointer;${r?'text-align:right':''}" onclick="VIEW_ESTOQUE._sort('${col}')">${lbl}${a}</th>`;}
  function fmt(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});}

  function render(){
    const loja = STORE.getFilters().loja;
    const catFilter=STORE.getFilters().categoria;
    let rows = DADOS.filter(r=>{
      const mL = loja==='all'||r.loja===loja;
      const mC = catFilter==='all'||r.categoria===catFilter;
      const mS = !_s||r.produto.toLowerCase().includes(_s.toLowerCase())||r.sku.includes(_s)||r.categoria.toLowerCase().includes(_s.toLowerCase());
      return mL && mC && mS;
    });
    rows = [...rows].sort((a,b)=>{
      let va=a[_sortCol],vb=b[_sortCol];
      if(typeof va==='string')va=va.toLowerCase();
      if(typeof vb==='string')vb=vb.toLowerCase();
      if(va===null||va===undefined)va=-Infinity;
      if(vb===null||vb===undefined)vb=-Infinity;
      if(va<vb)return _sortDir==='asc'?-1:1;
      if(va>vb)return _sortDir==='asc'?1:-1;
      return 0;
    });
    const counts={ok:0,atencao:0,critico:0,ruptura:0,zerado:0,'sem-giro':0};
    rows.forEach(r=>{if(counts[r.status]!==undefined)counts[r.status]++;});

    document.getElementById('view-container').innerHTML = `
      <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:16px">
        ${[['ok','OK','#16A34A'],['atencao','Atenção','#D97706'],['critico','Crítico','#EA580C'],['ruptura','Ruptura','#DC2626'],['zerado','Zerado','#6B7280']].map(([s,l,c])=>`
          <div class="kpi-card" style="cursor:pointer" onclick="VIEW_ESTOQUE._fs('${s}')">
            <div class="kpi-accent" style="background:${c}"></div>
            <div class="kpi-label">${l}</div>
            <div class="kpi-value" style="color:${c}">${counts[s]}</div>
          </div>`).join('')}
      </div>
      <div class="table-card">
        <div class="table-card-header">
          <span class="table-card-title">Todos os SKUs — ${rows.length} itens</span>
          <div style="display:flex;gap:8px">
            <input type="text" placeholder="Buscar…" value="${_s}" oninput="VIEW_ESTOQUE._ss(this.value)" data-search="estoque"
              style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;width:200px;font-family:inherit"/>
            <button class="btn-secondary btn-sm" onclick="VIEW_ESTOQUE._fs('')">Limpar</button>
          </div>
        </div>
        <div class="table-wrap"><table><thead><tr>
          ${th('loja','Loja')}${th('sku','SKU')}${th('produto','Produto')}${th('categoria','Categoria')}
          ${th('estoque','Estoque',true)}${th('vmd','VMD/dia',true)}${th('dias_estoque','Dias Est.',true)}
          ${th('qtd_vendida_periodo','Qtd Vend.',true)}${th('faturamento_vendas','Fat. R$',true)}
          <th>Status</th>
        </tr></thead><tbody>
          ${rows.length===0?'<tr><td colspan="10" style="text-align:center;padding:32px;color:#9CA3AF">Nenhum produto</td></tr>':
            rows.map(r=>`<tr>
              <td>${lojaB(r.loja)}</td>
              <td class="col-sku">${r.sku}</td>
              <td style="font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis">${r.produto}</td>
              <td style="color:#6B7280;font-size:12px">${r.categoria}</td>
              <td class="col-num" style="font-weight:700;color:${r.estoque<=0?'#DC2626':r.estoque<100?'#D97706':'#111827'}">${r.estoque}</td>
              <td class="col-num">${r.vmd>0?r.vmd.toFixed(1):'—'}</td>
              <td class="col-num" style="font-weight:700;color:${diasC(r.dias_estoque)}">${r.dias_estoque==='—'?'—':r.dias_estoque>=9999?'∞':r.dias_estoque}</td>
              <td class="col-num">${r.qtd_vendida_periodo>0?r.qtd_vendida_periodo.toLocaleString('pt-BR'):'—'}</td>
              <td class="col-money">${r.faturamento_vendas>0?fmt(r.faturamento_vendas):'—'}</td>
              <td>${badge(r.status)}</td>
            </tr>`).join('')}
        </tbody></table></div>
      </div>`;
  }

  let _sf='';
  function _fs(s){
    _sf=s; _s='';
    let rows=DADOS;
    const loja=STORE.getFilters().loja;
    if(loja!=='all') rows=rows.filter(r=>r.loja===loja);
    if(s) rows=rows.filter(r=>r.status===s);
    // Re-render with filtered data
    render();
  }
  function _ss(v){_s=v;const inp=document.querySelector('[data-search="estoque"]');const sel=inp?inp.selectionStart:0;render();requestAnimationFrame(()=>{const ni=document.querySelector('[data-search="estoque"]');if(ni){ni.focus();try{ni.setSelectionRange(sel,sel);}catch(e){}}});}
  function _sort(col){if(_sortCol===col)_sortDir=_sortDir==='asc'?'desc':'asc';else{_sortCol=col;_sortDir='asc';}render();}
  return{render,_ss,_sort,_fs};
})();

// ── ALERTAS ──────────────────────────────
const VIEW_ALERTAS = (function(){
  const LOJA_COLOR = {'Iririú':'#2563EB','Floresta':'#0891B2','Araquari':'#16A34A'};
  const ALL_LOJAS  = ['Iririú','Floresta','Araquari'];

  function lojaB(l){
    const cfg={'Iririú':'loja-iririu','Floresta':'loja-floresta','Araquari':'loja-araquari'};
    return `<span class="loja-badge ${cfg[l]||''}">${l}</span>`;
  }
  function diasC(d){ if(d<3)return'#DC2626';if(d<7)return'#EA580C';if(d<=15)return'#D97706';return'#9CA3AF'; }
  function fmt(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2}); }

  function render(){
    const lojaFilter = STORE.getFilters().loja;
    const catFilter2=STORE.getFilters().categoria;
    const rows = DADOS.filter(r => (lojaFilter==='all'||r.loja===lojaFilter)&&(catFilter2==='all'||r.categoria===catFilter2));

    const zerados  = rows.filter(r=>r.status==='zerado');
    const ruptura  = rows.filter(r=>r.status==='ruptura');
    const critico  = rows.filter(r=>r.status==='critico');
    const atencao  = rows.filter(r=>r.status==='atencao');
    const semGiro  = rows.filter(r=>r.status==='sem-giro'&&r.estoque>100);

    const cnt = zerados.length + ruptura.length + critico.length;
    const badge = document.getElementById('badge-alertas');
    if(badge){ badge.textContent=cnt; badge.classList.toggle('show',cnt>0); }

    // Per-loja summary for KPI cards
    function lojaAlert(loja) {
      const lr = rows.filter(r=>r.loja===loja);
      return {
        ruptura: lr.filter(r=>r.status==='ruptura').length,
        critico: lr.filter(r=>r.status==='critico').length,
        atencao: lr.filter(r=>r.status==='atencao').length,
        zerado:  lr.filter(r=>r.status==='zerado').length,
      };
    }

    function section(titulo, items, tipo) {
      if(!items.length) return '';
      const tc = tipo==='ruptura'?'alert-item-ruptura':tipo==='critico'?'alert-item-critico':tipo==='giro'?'alert-item-giro':'alert-item-atencao';
      return `
        <div class="section-label">${titulo}</div>
        <div class="alert-grid" style="margin-bottom:20px">
          ${items.slice(0,50).map(r=>`
            <div class="alert-item ${tc}">
              <div>
                <div class="alert-name">${r.produto}</div>
                <div class="alert-meta">${r.sku} · ${r.categoria}</div>
              </div>
              <div>${lojaB(r.loja)}</div>

          var promoBadge=promoD&&promoD.em_promo?'<span class="promo-badge">T06</span>':'';
          return '<tr>'+
            '<td>'+lojaB(r.loja)+'</td>'+
            '<td class="col-sku">'+r.sku+'</td>'+
            '<td style="font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis">'+clean(r.nome)+'</td>'+
            '<td class="col-num">'+fmtN(r.qtd)+'</td>'+
            '<td class="col-money">'+fmt(r.vlr)+'</td>'+

      '</tbody></table></div></div>';

  function render(){

    if(_tab==='overview')    content=renderOverview();
    else if(_tab==='categorias') content=renderCategorias();

      '<div class="tab-bar">'+

        '<button class="tab-btn '+(_tab==='categorias'?'active':'')+'" onclick="VIEW_VENDAS._setTab(\'categorias\')">📂 Categorias</button>'+
        '<button class="tab-btn '+(_tab==='promocao'?'active':'')+'" onclick="VIEW_VENDAS._setTab(\'promocao\')">🏷️ Promoção T06</button>'+

      // Projection box

        return{cat:e[0],vlr:vlr};
      }).filter(function(c){return c.vlr>0;}).sort(function(a,b){return b.vlr-a.vlr;});

      var colors=['#2563EB','#0891B2','#16A34A','#D97706','#EA580C','#7C3AED','#DB2777','#DC2626','#059669','#0284C7','#6B7280','#F59E0B'];
      var wCF=document.getElementById('wrap-cat-fat');
      if(wCF) wCF.style.height=Math.max(260,cats.length*30+50)+'px';
      var ctx4=document.getElementById('vc-cat-fat');
      if(ctx4) window._VC['cat-fat']=new Chart(ctx4,{type:'bar',data:{labels:cats.map(function(c){return c.cat.length>20?c.cat.substring(0,18)+'…':c.cat;}),datasets:[{data:cats.map(function(c){return Math.round(c.vlr);}),backgroundColor:colors,borderRadius:3,barThickness:16}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' R$'+c.parsed.x.toLocaleString('pt-BR',{minimumFractionDigits:0});}}}},scales:{x:{grid:GRID,ticks:{font:FONT,color:'#9CA3AF',callback:fmtCur}},y:{grid:{display:false},ticks:{font:FONT,color:'#374151'}}}}});

      var topCats=cats.slice(0,6);
      var ctx5=document.getElementById('vc-cat-mon');
      if(ctx5) window._VC['cat-mon']=new Chart(ctx5,{type:'line',data:{labels:MESES,datasets:topCats.map(function(c,i){return{label:c.cat,data:MESES.map(function(m){return (catMon[c.cat]||{})[m.toLowerCase()]||0;}),borderColor:colors[i],backgroundColor:colors[i]+'15',fill:false,tension:0.4,borderWidth:2,pointRadius:3};})},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:FONT,padding:10,boxWidth:10}}},scales:{x:{grid:{display:false},ticks:{font:FONT,color:'#9CA3AF'}},y:{grid:GRID,ticks:{font:FONT,color:'#9CA3AF'}}}}});
    }

    if(_tab==='promocao'){
      var pvn=CD.promo_vs_normal||{vlr_promo:0,vlr_normal:0};
      var ctx6=document.getElementById('vc-promo-donut');
      if(ctx6) window._VC['promo-donut']=new Chart(ctx6,{type:'doughnut',data:{labels:['Promoção T06','Preço Normal'],datasets:[{data:[Math.round(pvn.vlr_promo),Math.round(pvn.vlr_normal)],backgroundColor:['#D97706','#E5E7EB'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{font:FONT,padding:12}},tooltip:{callbacks:{label:function(c){return ' '+c.label+': R$'+c.parsed.toLocaleString('pt-BR',{minimumFractionDigits:0});}}}}}});

      var tp=CD.top_promo||[];
      var wTP=document.getElementById('wrap-top-promo');
      if(wTP) wTP.style.height=Math.max(200,tp.length*24+40)+'px';
      var ctx7=document.getElementById('vc-top-promo');
      if(ctx7) window._VC['top-promo']=new Chart(ctx7,{type:'bar',data:{labels:tp.map(function(p){return clean(p.nome||'').substring(0,28);}),datasets:[{data:tp.map(function(p){return Math.round(p.vlr);}),backgroundColor:'#D97706',borderRadius:3,barThickness:12}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' R$'+c.parsed.x.toLocaleString('pt-BR',{minimumFractionDigits:0});}}}},scales:{x:{grid:GRID,ticks:{font:FONT,color:'#9CA3AF',callback:fmtCur}},y:{grid:{display:false},ticks:{font:FONT,color:'#374151'}}}}});
    }
  }

  function _setTab(t){ _tab=t; render(); }
  function _ss(v){
    _s=v;
    var inp=document.querySelector('[data-search="vendas"]');
    var sel=inp?inp.selectionStart:0;
    render();
    requestAnimationFrame(function(){var ni=document.querySelector('[data-search="vendas"]');if(ni){ni.focus();try{ni.setSelectionRange(sel,sel);}catch(e){}}});
  }
  function _sort(col){
    if(_sortCol===col)_sortDir=_sortDir==='asc'?'desc':'asc';
    else{_sortCol=col;_sortDir='desc';}
    render();
  }

  return{render,_setTab,_ss,_sort};
})();


// ── ANALISE ──────────────────────────────
const VIEW_ANALISE = (function(){
  let _tab='todos', _s='', _lojaF='all', _catF='all', _promoF='all', _sortCol='produto', _sortDir='asc';

  const LOJAS_CFG = {
    'Iririú':   { color:'#2563EB', bg:'#EFF6FF', badge:'loja-iririu'   },
    'Floresta': { color:'#0891B2', bg:'#E0F2FE', badge:'loja-floresta' },
    'Araquari': { color:'#16A34A', bg:'#F0FDF4', badge:'loja-araquari' },
  };
  const ALL_LOJAS = ['Iririú','Floresta','Araquari'];

  function fmt(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});}
  function fmtN(v){return (v||0).toLocaleString('pt-BR');}

  function lojaB(l){
    const cfg=LOJAS_CFG[l]||{bg:'#F3F4F6',color:'#374151',badge:''};
    return `<span class="loja-badge ${cfg.badge}">${l}</span>`;
  }

  function promoBadge(p){
    if(!p.em_promo) return '';
    if(p.promo_tag&&p.promo_tag.includes('Super')) return '<span class="super-badge">SUPER</span>';
    if(p.promo_tag&&p.promo_tag.includes('Novo'))  return '<span class="novo-badge">NOVO</span>';
    return '<span class="promo-badge">T06</span>';
  }

  function statusB(s){
    const m={ok:'badge-ok',atencao:'badge-atencao',critico:'badge-critico',ruptura:'badge-ruptura',zerado:'badge-zerado','sem-giro':'badge-zerado'};
    const l={ok:'OK',atencao:'Atenção',critico:'Crítico',ruptura:'Ruptura',zerado:'Zerado','sem-giro':'Sem giro'};
    return `<span class="badge ${m[s]||'badge-zerado'}">${l[s]||s}</span>`;
  }

  function diasColor(d){
    if(!d||d==='∞'||d>=9999) return '#6B7280';
    if(d<3)  return '#DC2626';
    if(d<7)  return '#EA580C';
    if(d<=15) return '#D97706';
    return '#16A34A';
  }

  function th(col,lbl,r){
    const a=_sortCol===col?(_sortDir==='asc'?' ↑':' ↓'):'';
    return `<th style="cursor:pointer;${r?'text-align:right':''}" onclick="VIEW_ANALISE._sort('${col}')">${lbl}${a}</th>`;
  }

  function getRows(){
    let rows=DADOS.filter(p=>{
      const mL=_lojaF==='all'||p.loja===_lojaF;
      const _gCat=STORE.getFilters().categoria;
      const mC=(_catF==='all'||p.categoria===_catF)&&(_gCat==='all'||p.categoria===_gCat);
      const mP=_promoF==='all'
        ||(_promoF==='promo'&&p.em_promo)
        ||(_promoF==='super'&&p.promo_tag&&p.promo_tag.includes('Super'))
        ||(_promoF==='critico'&&(p.status==='ruptura'||p.status==='critico'))
        ||(_promoF==='zerado'&&p.estoque<=0);
      const mS=!_s||p.produto.toLowerCase().includes(_s.toLowerCase())||p.sku.includes(_s);
      return mL&&mC&&mP&&mS;
    });
    return [...rows].sort((a,b)=>{
      let va=a[_sortCol],vb=b[_sortCol];
      if(typeof va==='string') va=va.toLowerCase();
      if(typeof vb==='string') vb=vb.toLowerCase();
      if(va===null||va===undefined) va=-Infinity;
      if(vb===null||vb===undefined) vb=-Infinity;
      return _sortDir==='asc'?(va<vb?-1:va>vb?1:0):(va<vb?1:va>vb?-1:0);
    });
  }

  // ── TAB: TODOS OS SKUs ───────────────────
  function renderTodos(){
    const rows=getRows();
    const cats=[...new Set(DADOS.map(p=>p.categoria))].sort();
    return `
      <div class="filter-row">
        <input type="text" placeholder="🔍 Buscar produto, SKU, categoria…"
          value="${_s}" oninput="VIEW_ANALISE._ss(this.value)" data-search="analise" style="width:240px"/>
        <select onchange="VIEW_ANALISE._sl(this.value)">
          <option value="all" ${_lojaF==='all'?'selected':''}>Todas as lojas</option>
          ${ALL_LOJAS.map(l=>`<option value="${l}" ${_lojaF===l?'selected':''}>${l}</option>`).join('')}
        </select>
        <select onchange="VIEW_ANALISE._sc(this.value)">
          <option value="all">Todas as categorias</option>
          ${cats.map(c=>`<option value="${c}" ${_catF===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <select onchange="VIEW_ANALISE._sp(this.value)">
          <option value="all">Filtrar por…</option>
          <option value="promo">Em promoção T06</option>
          <option value="super">Super Promoção</option>
          <option value="critico">Ruptura / Crítico</option>
          <option value="zerado">Zerados</option>
        </select>
        <span class="count-badge">${rows.length} itens</span>
      </div>
      <div class="table-card"><div class="table-wrap"><table><thead><tr>
        ${th('loja','Loja')}${th('sku','SKU')}${th('produto','Produto')}${th('categoria','Categoria')}
        ${th('estoque','Estoque',true)}${th('vmd','VMD',true)}${th('dias_estoque','Dias',true)}
        ${th('valor_unit','Preço',true)}${th('preco_t06','T06',true)}${th('faturamento_vendas','Fat.',true)}
        <th>Status</th><th>Promo</th>
      </tr></thead><tbody>
        ${rows.length===0?'<tr><td colspan="12" style="text-align:center;padding:28px;color:#9CA3AF">Nenhum produto</td></tr>':
          rows.map(r=>`<tr>
            <td>${lojaB(r.loja)}</td>
            <td class="col-sku">${r.sku}</td>
            <td style="font-weight:500;max-width:170px;overflow:hidden;text-overflow:ellipsis">${r.produto}</td>
            <td style="color:#6B7280;font-size:12px">${r.categoria}</td>
            <td class="col-num" style="font-weight:700;color:${r.estoque<=0?'#DC2626':r.estoque<100?'#D97706':'#111827'}">${r.estoque}</td>
            <td class="col-num">${r.vmd>0?r.vmd.toFixed(1):'—'}</td>
            <td class="col-num" style="font-weight:700;color:${diasColor(r.dias_num)}">${r.dias_estoque==='∞'||r.dias_estoque>=9999?'∞':r.dias_estoque||'—'}</td>
            <td class="col-num">${fmt(r.valor_unit)}</td>
            <td class="col-num ${r.preco_t06?'col-promo':''}">${r.preco_t06?fmt(r.preco_t06):'—'}</td>
            <td class="col-money">${r.faturamento_vendas>0?fmt(r.faturamento_vendas):'—'}</td>
            <td>${statusB(r.status)}</td>
            <td>${promoBadge(r)}</td>
          </tr>`).join('')}
      </tbody></table></div></div>`;
  }

  // ── TAB: TRANSFERÊNCIAS (3 lojas) ────────
  function renderTransfer(){
    const LOJA_COLOR = {'Iririú':'#2563EB','Floresta':'#0891B2','Araquari':'#16A34A'};

    let items = TRANSFERENCIAS.filter(t =>
      !_s || t.produto.toLowerCase().includes(_s.toLowerCase()) || t.sku.includes(_s)
    );

    // Filter by loja if set
    if (_lojaF !== 'all') {
      items = items.filter(t => t.direcao.includes(_lojaF));
    }

    const urgente = items.filter(t => ['ruptura','critico','zerado'].includes(t.status_dst));
    const normal  = items.filter(t => !['ruptura','critico','zerado'].includes(t.status_dst));

    function stockBar(loja, val, maxVal) {
      const w = Math.round((val/Math.max(maxVal,1))*54);
      return `<div style="margin-top:3px"><div class="stock-bar" style="width:${w}px;background:${LOJA_COLOR[loja]||'#999'}"></div></div>`;
    }

    function lojaStockCol(loja, t) {
      const est = t[`estoque_${loja.toLowerCase()}`];
      if (est === undefined || est === null) return '<div style="color:#D1D5DB;font-size:11px;text-align:center">—</div>';
      const mx  = Math.max(t.estoque_floresta||0, t.estoque_iririu||0, t.estoque_araquari||0, 1);
      const isDst = t.direcao.endsWith(loja);
      const isSrc = t.direcao.startsWith(loja);
      const borderStyle = isDst ? `border:2px solid ${LOJA_COLOR[loja]};border-radius:6px;padding:2px 4px` :
                          isSrc ? `border:1px dashed ${LOJA_COLOR[loja]};border-radius:6px;padding:2px 4px` : '';

      // Show VMD for src and dst
      let vmdLabel = '';
      if (isSrc) vmdLabel = `<div style="font-size:10px;color:#6B7280">VMD ${(t.vmd_src||0).toFixed(1)}</div>`;
      if (isDst) vmdLabel = `<div style="font-size:10px;color:#6B7280">VMD ${(t.vmd_dst||0).toFixed(1)} · <span style="color:${diasColor(t.dias_dst)}">${t.dias_dst>=9999?'∞':t.dias_dst}d</span></div>`;

      return `
        <div style="text-align:center;${borderStyle}">
          <div style="font-size:15px;font-weight:700;color:${LOJA_COLOR[loja]}">${est}</div>
          <div style="font-size:10px;color:#9CA3AF">${loja}</div>
          ${vmdLabel}
          ${stockBar(loja, est, mx)}
        </div>`;
    }

    function renderCard(t, cor) {
      const dst_status = t.status_dst==='zerado'?'🔴 zerado':t.status_dst==='ruptura'?'🔴 ruptura':t.status_dst==='critico'?'🟠 crítico':'';

      const [src_name, dst_name] = t.direcao.split(' → ');

      return `
        <div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid ${cor};border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:8px;display:grid;grid-template-columns:1fr 90px 90px 90px 60px 60px;align-items:center;gap:10px">
          <div>
            <div style="font-size:13px;font-weight:600;color:var(--text-1)">${t.produto}</div>

            <div style="margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              <span style="font-size:11px;background:${cor}18;color:${cor};padding:2px 8px;border-radius:4px;font-weight:600">
                ${src_name} → ${dst_name}
              </span>
              ${t.em_promo?`<span class="promo-badge">T06 R$${t.preco_t06}</span>`:''}
              ${dst_status?`<span style="font-size:11px;font-weight:600;color:#DC2626">${dst_status}</span>`:''}
            </div>
          </div>
          ${lojaStockCol('Iririú',   t)}
          ${lojaStockCol('Floresta', t)}
          ${lojaStockCol('Araquari', t)}
          <div style="text-align:center">
            <div style="font-size:14px;font-weight:700;color:${cor}">Δ${Math.abs(t.diferenca)}</div>
            <div style="font-size:10px;color:#9CA3AF">diferença</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:13px;font-weight:700;color:${cor}">~${t.sugestao}</div>
            <div style="font-size:10px;color:#9CA3AF">sugestão</div>
          </div>
        </div>`;
    }

    function renderGroup(list, titulo, cor) {
      if (!list.length) return '';
      return `
        <div class="section-label">${titulo} <span style="color:${cor}">(${list.length})</span></div>
        <div style="background:#F9FAFB;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:11px;color:#6B7280;display:grid;grid-template-columns:1fr 90px 90px 90px 60px 60px;gap:10px;font-weight:600">

  // ── PARSERS ───────────────────────────────
  function categorize(nome){
    var n=nome.toUpperCase();
    if(n.includes('PICOLÉ FRUTA')||n.includes('PICOLE FRUTA')) return 'Picolé Fruta';
    if(n.includes('PICOLÉ MAIS')||n.includes('MAIS CÔCO')||n.includes('COCO QUEIMADO')) return 'Picolé Zero';
    if(n.includes('PICOLÉ CREME')||n.includes('PICOLE CREME')) return 'Picolé Creme';
    if(n.includes('ITUZINHO')||n.includes('KIDS')||n.includes('PICOLÁPIS')) return 'Picolé Infantil';
    if(n.includes('BOMBOM')||n.includes('DIAMOND')||n.includes('BARRITA')||n.includes('CHOCOTINE')) return 'Picolé Premium';
    if(n.includes('MEX.')||n.includes('MEXICANO')) return 'Picolé Premium';
    if(n.includes('GREGO')||n.includes('SPECIALE')||n.includes('SOBREMESA')||n.includes('UNICÓRNIO')) return 'Picolé Premium';
    if(n.includes('PICOLÉ')||n.includes('PICOLE')) return 'Picolé';
    if((n.includes('POTE')||n.includes('SORVETE'))&&n.replace(/\s/g,'').includes('2L')) return 'Pote 2L';
    if(n.includes('NEVADO')||n.includes('1,5')) return 'Pote 1,5L';
    if(n.includes('POTE')) return 'Pote';
    if(n.includes('AÇAÍ')||n.includes('ACAI')) return 'Açaí';
    if(n.includes('CONE')||n.includes('SELETTO')||n.includes('BEST CUP')) return 'Cone / Best Cup';
    if(n.includes('NAPOLICUP')) return 'Especial';
    if(n.includes('SUNDAE')||n.includes('COPINHO')) return 'Sorvete Servido';
    if(n.startsWith('REV -')||n.startsWith('REV –')) return 'Produto Seco';
    return 'Outros';
  }

  function parseEstoque(wb, loja){
    var sheetName = wb.SheetNames.find(function(n){return n.toUpperCase().includes('ESTOQUE');})||wb.SheetNames[0];
    var raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:null});
    var headerIdx=-1;
    for(var i=0;i<Math.min(raw.length,6);i++){
      var rv=(raw[i]||[]).map(function(v){return String(v||'').toUpperCase();});
      if(rv.some(function(v){return v==='CÓD'||v==='COD'||v==='CÓDIGO';})){ headerIdx=i; break; }
    }
    if(headerIdx<0){ _errors.push('Cabeçalho CÓD não encontrado'); return []; }
    var header=(raw[headerIdx]||[]).map(function(v){return String(v||'');});
    var saldoCol=-1, valorCol=-1;
    header.forEach(function(hh,i){
      var hu=hh.toUpperCase();
      if(hu.includes('SALDO-DIA')||hu.includes('SALDO DIA')) saldoCol=i;
      if(hu.includes('VALOR UN')||hu.includes('VALOR UNIT')) valorCol=i;
    });
    if(saldoCol<0) _warnings.push('Coluna Saldo-dia não encontrada pelo nome');
    if(valorCol<0) _warnings.push('Coluna Valor un. não encontrada');
    var rows=[];
    for(var j=headerIdx+1;j<raw.length;j++){
      var row=raw[j]||[];
      var cod=row[0]; if(!cod) continue;
      var codInt=parseInt(String(cod)); if(isNaN(codInt)) continue;
      var nome=String(row[1]||'').trim();
      var saldo=saldoCol>=0?(parseInt(row[saldoCol])||0):0;
      var valor=valorCol>=0?(parseFloat(row[valorCol])||0):0;
      rows.push({sku:String(codInt),produto:nome,estoque:Math.max(0,saldo),valor_unit:valor,valor_total:Math.round(Math.max(0,saldo)*valor*100)/100,loja:loja,categoria:categorize(nome),em_promo:false,preco_t06:null});
    }
    if(rows.length<5) _warnings.push('Apenas '+rows.length+' produtos encontrados');
    return rows;
  }

  function parseVendas(wb, loja){
    var raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
    if((raw[0]||[]).length<2){ _errors.push('Arquivo exportado incorretamente pelo Zanthus (1 coluna). Gere o relatório novamente.'); return []; }
    var rows=[];
    for(var i=5;i<raw.length;i++){
      var row=raw[i]||[];
      var raw0=String(row[0]||'').trim();
      var m=raw0.match(/^0*(\d+)\s*[-\u2013]\s*(.+)$/);
      if(!m) continue;
      var sku=m[1].replace(/^0+/,'')||'0';
      var nome=m[2].trim();
      var qtd=parseInt(row[1])||0;
      var vlr=parseFloat(row[2])||0;
      rows.push({sku:sku,nome:nome,qtd:qtd,vlr:Math.round(vlr*100)/100,loja:loja});
    }
    if(rows.length<3) _errors.push('Nenhum dado encontrado. Arquivo pode estar vazio.');
    return rows;
  }

  // ── APLICAR ───────────────────────────────
  function aplicar(rows){
    var TOTAL_DIAS=87;
    if(_tipo==='estoque'){
      var outros=DADOS.filter(function(p){return p.loja!==_loja;});
      var vmdMap={};
      DADOS.filter(function(p){return p.loja===_loja;}).forEach(function(p){
        vmdMap[p.sku]={vmd:p.vmd,qtd:p.qtd_vendida_periodo,vlr:p.faturamento_vendas};
      });
      var novos=rows.map(function(p){
        var v=vmdMap[p.sku]||{vmd:0,qtd:0,vlr:0};
        var dias=v.vmd>0?Math.round(p.estoque/v.vmd*10)/10:(p.estoque<=0?0:9999);
        var status=p.estoque<=0?'zerado':v.vmd<=0?'sem-giro':dias<3?'ruptura':dias<7?'critico':dias<=15?'atencao':'ok';
        return Object.assign({},p,{estoque_sexta:p.estoque,qtd_vendida_periodo:v.qtd,faturamento_vendas:v.vlr,vmd:v.vmd,dias_estoque:dias>=9999?'∞':dias,dias_num:dias,status:status});
      });
      DADOS.length=0;
      outros.concat(novos).forEach(function(d){DADOS.push(d);});
    } else {
      var periodoKey=_periodo.toLowerCase();
      var outros2=VENDAS_SUM.filter(function(v){return v.loja!==_loja;});
      var existing=VENDAS_SUM.filter(function(v){return v.loja===_loja;});
      rows.forEach(function(r){
        var idx=existing.findIndex(function(v){return v.sku===r.sku;});
        if(idx>=0){ existing[idx][periodoKey]=(existing[idx][periodoKey]||0)+r.qtd; existing[idx].qtd+=r.qtd; existing[idx].vlr+=r.vlr; }
        else{ var e={sku:r.sku,nome:r.nome,loja:_loja,qtd:r.qtd,vlr:r.vlr,abril:0,maio:0,junho:0,sabado:0}; e[periodoKey]=r.qtd; existing.push(e); }
      });
      VENDAS_SUM.length=0;
      outros2.concat(existing).forEach(function(v){VENDAS_SUM.push(v);});
      var vendaMap={};
      VENDAS_SUM.filter(function(v){return v.loja===_loja;}).forEach(function(v){vendaMap[v.sku]={qtd:v.qtd,vlr:v.vlr};});
      DADOS.filter(function(p){return p.loja===_loja;}).forEach(function(p){
        var v=vendaMap[p.sku]||{qtd:0,vlr:0};
        p.qtd_vendida_periodo=v.qtd; p.faturamento_vendas=v.vlr;
        p.vmd=Math.round(v.qtd/TOTAL_DIAS*100)/100;
        if(p.estoque<=0){p.status='zerado';p.dias_estoque=0;p.dias_num=0;}
        else if(p.vmd<=0){p.status='sem-giro';p.dias_estoque='∞';p.dias_num=9999;}
        else{var d=Math.round(p.estoque/p.vmd*10)/10;p.dias_estoque=d;p.dias_num=d;p.status=d<3?'ruptura':d<7?'critico':d<=15?'atencao':'ok';}
      });
    }
    document.getElementById('last-update').textContent=_loja+' · '+(_tipo==='estoque'?'estoque':'vendas '+_periodo)+' atualizado';
  }

  // ── ACTIONS ───────────────────────────────
  function _setTipo(t){ _tipo=t; render(); }
  function _setLoja(l){ _loja=l; render(); }
  function _setPeriodo(p){ _periodo=p; render(); }
  function _next(){
    if(_step==='tipo'&&_tipo) _step='loja';
    else if(_step==='loja'&&_loja) _step='periodo';
    render();
  }
  function _back(){
    if(_step==='loja') _step='tipo';
    else if(_step==='periodo') _step='loja';
    else if(_step==='preview') _step='periodo';
    render();
  }
  function _handleFile(file){ if(!file) return; _file=file; render(); }

  function _processar(){
    if(!_file||!_periodo) return;
    document.getElementById('step-content').innerHTML='<div style="text-align:center;padding:48px;color:#6B7280"><div style="font-size:32px;margin-bottom:12px">⏳</div>Processando arquivo…</div>';
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:'array'});
        _errors=[]; _warnings=[];
        _parsed=_tipo==='estoque'?parseEstoque(wb,_loja):parseVendas(wb,_loja);
        if(_errors.length){
          document.getElementById('step-content').innerHTML='<div style="max-width:480px;margin:0 auto;text-align:center;padding:32px"><div style="font-size:36px">❌</div><div style="font-size:15px;font-weight:600;margin-top:12px">Erro ao processar</div><div style="font-size:13px;color:#DC2626;margin-top:8px">'+_errors.join('<br>')+'</div><button onclick="VIEW_IMPORTAR._back()" class="btn-secondary" style="margin-top:16px">← Tentar novamente</button></div>';
          return;
        }
        _step='preview'; render();
      }catch(err){
        document.getElementById('step-content').innerHTML='<div style="text-align:center;padding:32px"><div style="font-size:36px">❌</div><div style="font-size:13px;color:#DC2626;margin-top:8px">'+err.message+'</div><button onclick="VIEW_IMPORTAR._back()" class="btn-secondary" style="margin-top:16px">← Voltar</button></div>';
      }
    };
    reader.readAsArrayBuffer(_file);
  }

  function _aplicar(){ aplicar(_parsed); _step='done'; render(); }
  function _reset(){ _step='tipo';_tipo=null;_loja=null;_periodo=null;_file=null;_parsed=null;_errors=[];_warnings=[]; }

  return { render, _setTipo, _setLoja, _setPeriodo, _next, _back, _handleFile, _processar, _aplicar, _reset };
})();

  // ── TAB: ANÁLISE DE GIRO ─────────────────────
  function renderGiro(){
    // Per-product analysis: how much was ordered vs how much was sold
    var prodMap = {};
    var peds = getPedidos();

    peds.forEach(function(p){
      p.itens.forEach(function(item){
        var key = item.descricao.substring(0,45).trim();
        if(!prodMap[key]) prodMap[key] = {desc:key, loja:p.loja, pedido_un:0, vendido_un:0, pedidos:0};
        prodMap[key].pedido_un += item.unidades;
        prodMap[key].pedidos   += 1;
      });
    });

    // Match with sales data
    Object.keys(prodMap).forEach(function(key){
      var desc = key.toUpperCase();
      // Try to find matching VENDAS_SUM entry
      var matches = VENDAS_SUM.filter(function(v){
        var nome = v.nome.toUpperCase();
        // Fuzzy match: check if significant words match
        var words = desc.split(' ').filter(function(w){return w.length>4;});
        var matchCount = words.filter(function(w){return nome.includes(w);}).length;
        return matchCount >= Math.min(2, words.length) && (_lojaF==='all' || v.loja===_lojaF);
      });
      prodMap[key].vendido_un = matches.reduce(function(s,v){return s+v.qtd;},0);
    });

    var rows = Object.values(prodMap)
      .filter(function(p){return p.pedido_un > 0;})
      .sort(function(a,b){return b.pedido_un - a.pedido_un;});

    var tableRows = rows.map(function(r){
      var ratio = r.vendido_un > 0 ? Math.round(r.vendido_un / r.pedido_un * 100) : 0;
      var ratioColor = ratio >= 80 ? '#16A34A' : ratio >= 50 ? '#D97706' : '#DC2626';
      var ratioLabel = ratio >= 80 ? 'Bom giro' : ratio >= 50 ? 'Giro médio' : 'Baixo giro';
      var barW = Math.min(ratio, 100);

        '<td style="font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis">'+r.desc+'</td>'+

        '<div class="kpi-label">Total Vendido (un)</div><div class="kpi-value">'+fmtN(totalVendido)+'</div>'+
        '<div class="kpi-sub">unidades vendidas no período</div></div>'+
      '<div class="kpi-card"><div class="kpi-accent" style="background:'+(giroGeral>=70?'#16A34A':'#D97706')+'"></div>'+
        '<div class="kpi-label">Giro Geral</div>'+
        '<div class="kpi-value" style="color:'+(giroGeral>=70?'#16A34A':'#D97706')+'">'+giroGeral+'%</div>'+
        '<div class="kpi-sub">do que foi pedido foi vendido</div></div>'+
    '</div>'+
    '<div style="background:#EFF6FF;border:1px solid #DBEAFE;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:12px;color:#1D4ED8">'+
      '<strong>Como ler:</strong> Compara unidades pedidas (engradados × un/cx) com unidades vendidas no período. '+
